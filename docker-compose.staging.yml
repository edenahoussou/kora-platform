# Staging environment - deploiement automatique sur merge vers main
# Le container app tourne sous Supervisor : php-fpm + queue worker + scheduler.
services:
  app: &application
    image: ghcr.io/edenahoussou/kora-ops-web:staging
    build:
      context: .
      dockerfile: infra/docker/kora-ops-web/Dockerfile.prod
    container_name: kora-staging-app
    working_dir: /app
    env_file: .env.staging
    environment:
      QUEUE_CONNECTION: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kora_staging
      DB_USERNAME: kora
      DB_PASSWORD: ${DB_PASSWORD_STAGING}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SCHEME: ""
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_ADDRESS: no-reply@kora.demo
      MAIL_FROM_NAME: KORA Staging
      LOG_STACK: docker
    command: [ "sh", "-c", "chown -R www-data:www-data /app/storage /app/bootstrap/cache && exec supervisord -c /etc/supervisor/conf.d/supervisord.conf" ]
    volumes:
      - staging-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - kora-staging
    restart: unless-stopped
    stop_grace_period: 90s

  nginx:
    build:
      context: infra/docker/nginx/
      dockerfile: Dockerfile
    container_name: kora-staging-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staging-public:/app/public:ro
      - staging-storage:/app/storage:ro
    depends_on:
      - app
    networks:
      - kora-staging
    restart: unless-stopped

  # Copie les assets de l'image app vers le volume staging-public
  sync-public:
    image: ghcr.io/edenahoussou/kora-ops-web:staging
    container_name: kora-staging-sync-public
    volumes:
      - staging-public:/sync
    command: [ "sh", "-c", "cp -a /app/public/. /sync/ && echo 'Public assets synced'" ]
    depends_on:
      - app
    networks:
      - kora-staging
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: kora-staging-postgres
    environment:
      POSTGRES_DB: kora_staging
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: ${DB_PASSWORD_STAGING}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kora -d kora_staging" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kora-staging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kora-staging-redis
    volumes:
      - staging-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kora-staging
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: kora-staging-mailpit
    environment:
      MP_WEBROOT: /mailpit/
    expose:
      - "1025"
      - "8025"
    networks:
      - kora-staging
    restart: unless-stopped

volumes:
  staging-storage:
  staging-public:
  staging-postgres-data:
  staging-redis-data:

networks:
  kora-staging:
    driver: bridge
