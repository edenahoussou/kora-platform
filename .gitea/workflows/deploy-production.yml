name: Deploy Production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.mezagency.fr
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/kora-ops-web/Dockerfile.prod
          push: true
          tags: |
            gitea.mezagency.fr/bj/kora-platform/kora-ops-web:latest
            gitea.mezagency.fr/bj/kora-platform/kora-ops-web:${{ steps.tag.outputs.VERSION }}
          cache-from: type=registry,ref=gitea.mezagency.fr/bj/kora-platform/kora-ops-web:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/kora-prod
            git pull origin main

            # Backup DB avant migration
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U kora kora_prod > /opt/kora-prod/backups/db-backup-$TIMESTAMP.sql
            echo "Backup created: db-backup-$TIMESTAMP.sql"

            # Garder seulement les 5 derniers backups
            ls -t /opt/kora-prod/backups/db-backup-*.sql | tail -n +6 | xargs rm -f 2>/dev/null || true

            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-deps app nginx
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan event:cache
            docker image prune -f
            echo "Production deployed: $(date)"
