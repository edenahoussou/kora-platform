name: flutter_networking
description: >
  Couche réseau partagée entre toutes les apps Flutter du monorepo KORA :
  client HTTP (Dio) préconfiguré avec intercepteurs auth/logs, et détection
  de connectivité. Volontairement agnostique de l'app qui l'utilise (pas
  d'URL, de clé de stockage ni de nom d'endpoint en dur ici) — toute la
  configuration est injectée par l'app consommatrice (voir
  `DioClient` et `core/di/injector.dart` de kora-app-passenger).
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
