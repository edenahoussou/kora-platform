schemas:
  Error:
    type: object
    required:
      - message
    properties:
      message:
        type: string
        example: 'Not Found'
  ValidationError:
    type: object
    required:
      - message
      - errors
    properties:
      message:
        type: string
        example: 'Le champ weight grams doit être au moins 1.'
      errors:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
        example:
          weight_grams:
            - 'Le champ weight grams doit être au moins 1.'
  UnauthorizedError:
    type: object
    required:
      - message
    properties:
      message:
        type: string
        example: Unauthenticated.
  Parcel:
    type: object
    description: 'Ressource Colis exposée au titulaire. Aucun code de retrait, hash, secret ou payload prestataire.'
    properties:
      uuid:
        type: string
        format: uuid
        example: 00000000-0000-4000-8000-000000000010
      reference:
        type: string
        nullable: true
        example: KC-20260101-00002
      tracking_url:
        type: string
        format: uri
        nullable: true
        example: 'https://staging.koraexpress.app/api/v1/parcels/tracking/KC-20260101-00002'
      qr_payload:
        type: string
        format: uri
        nullable: true
        example: 'https://staging.koraexpress.app/api/v1/parcels/tracking/KC-20260101-00002'
      status:
        type: string
        enum:
          - preregistered
          - weighed
          - registered
          - ready
          - assigned
          - in_transit
          - arrived
          - available
          - withdrawn
          - cancelled
          - refused
          - return_pending
          - return_arrived
          - returned
      origin:
        type: string
        nullable: true
        example: Cotonou
      destination:
        type: string
        nullable: true
        example: Porto-Novo
      sender_name:
        type: string
        example: 'Expéditeur Exemple'
      recipient_name:
        type: string
        example: 'Destinataire Exemple'
      contents:
        type: string
        example: Documents
      weight_grams:
        type: integer
        nullable: true
        example: 5000
      declared_grams:
        type: integer
        example: 5000
      inspection_state:
        type: string
        enum:
          - pending_inspection
          - accepted
          - refused
        example: accepted
      inspection:
        type: object
        properties:
          state:
            type: string
            enum:
              - pending_inspection
              - accepted
              - refused
            example: accepted
          category:
            type: string
            nullable: true
            example: allowed
          refusal_reason:
            type: string
            nullable: true
            example: null
          inspected_at:
            type: string
            format: date-time
            nullable: true
            example: '2026-11-22T19:21:10+00:00'
          hub_uuid:
            type: string
            format: uuid
            nullable: true
            example: 00000000-0000-4000-8000-000000000002
          hub_name:
            type: string
            nullable: true
            example: 'Cotonou · Dantokpa'
      can_pay:
        type: boolean
        example: false
      can_receipt:
        type: boolean
        example: true
      can_ready:
        type: boolean
        example: false
      can_assign:
        type: boolean
        example: false
      can_manifest:
        type: boolean
        example: false
      can_receive:
        type: boolean
        example: false
      can_release:
        type: boolean
        example: false
      can_reissue:
        type: boolean
        example: false
      can_override_handoff:
        type: boolean
        example: false
      can_return_charge:
        type: boolean
        example: false
      can_pay_return:
        type: boolean
        example: false
      can_print_handoff_proof:
        type: boolean
        example: false
      origin_hub_uuid:
        type: string
        format: uuid
        nullable: true
        example: 00000000-0000-4000-8000-000000000002
      destination_hub_uuid:
        type: string
        format: uuid
        nullable: true
        example: 00000000-0000-4000-8000-000000000003
      custody_hub_uuid:
        type: string
        format: uuid
        nullable: true
        example: 00000000-0000-4000-8000-000000000002
      deposit_hub_uuid:
        type: string
        format: uuid
        nullable: true
        example: 00000000-0000-4000-8000-000000000002
      deposit_hub:
        type: object
        nullable: true
        properties:
          uuid:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-000000000002
          kind:
            type: string
            enum:
              - agency
              - partner_point
            example: agency
          city:
            type: string
            example: Cotonou
      selling_agency_uuid:
        type: string
        format: uuid
        nullable: true
        example: 00000000-0000-4000-8000-000000000004
      selling_agency:
        type: object
        nullable: true
        properties:
          uuid:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-000000000004
          name:
            type: string
            example: 'Agence Cotonou'
      withdraw_by:
        type: string
        format: date-time
        nullable: true
        example: null
      return_handed_over_at:
        type: string
        format: date-time
        nullable: true
        example: null
      handoff:
        type: object
        properties:
          received_at:
            type: string
            format: date-time
            nullable: true
            example: null
          received_by:
            type: string
            nullable: true
            example: null
          delivered_at:
            type: string
            format: date-time
            nullable: true
            example: null
          delivered_by:
            type: string
            nullable: true
            example: null
          hub_uuid:
            type: string
            format: uuid
            nullable: true
            example: null
          hub_name:
            type: string
            nullable: true
            example: null
          outcome:
            type: string
            enum:
              - withdrawn
              - returned
            nullable: true
            example: null
          method:
            type: string
            enum:
              - code
              - identity
            nullable: true
            example: null
          identity_type:
            type: string
            nullable: true
            example: null
          attempts:
            type: integer
            example: 0
          max_attempts:
            type: integer
            example: 5
          attempts_remaining:
            type: integer
            example: 5
      expires_at:
        type: string
        format: date-time
        example: '2026-11-24T19:20:19+00:00'
      updated_at:
        type: string
        format: date-time
        example: '2026-11-22T19:20:19+00:00'
      departure_uuid:
        type: string
        format: uuid
        nullable: true
        example: null
      eta:
        type: string
        format: date-time
        nullable: true
        example: null
      tracking_updated_at:
        type: string
        format: date-time
        nullable: true
        example: null
      incident_open:
        type: boolean
        example: false
      quote:
        type: object
        nullable: true
        properties:
          uuid:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-000000000020
          net:
            type: integer
            example: 1500
          tax:
            type: integer
            example: 0
          total:
            type: integer
            example: 1500
          currency:
            type: string
            example: XOF
          tariff_uuid:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-000000000101
          tariff_version:
            type: integer
            example: 2
          deposit_kind:
            type: string
            example: agency
          base_amount:
            type: integer
            example: 1500
          step_amount:
            type: integer
            example: 0
          step_grams:
            type: integer
            example: 1000
          maximum_grams:
            type: integer
            example: 30000
      timeline:
        type: array
        description: 'Présent uniquement lorsque la relation events est chargée.'
        items:
          type: object
          properties:
            kind:
              type: string
              example: registered
            observed_at:
              type: string
              format: date-time
              example: '2026-11-20T09:15:00+00:00'
  ParcelResponse:
    type: object
    required:
      - data
    properties:
      data:
        $ref: '#/components/schemas/Parcel'
  CorridorResponse:
    type: object
    required:
      - data
    properties:
      data:
        type: array
        items:
          type: object
          properties:
            uuid:
              type: string
              format: uuid
            origin:
              type: object
              properties:
                uuid:
                  type: string
                  format: uuid
                city:
                  type: string
                name:
                  type: string
            destination:
              type: object
              properties:
                uuid:
                  type: string
                  format: uuid
                city:
                  type: string
                name:
                  type: string
  ParcelCollectionResponse:
    type: object
    required:
      - data
      - links
      - meta
    properties:
      data:
        type: array
        items:
          $ref: '#/components/schemas/Parcel'
      links:
        type: object
        properties:
          first:
            type: string
            format: uri
            nullable: true
          last:
            type: string
            format: uri
            nullable: true
          prev:
            type: string
            format: uri
            nullable: true
          next:
            type: string
            format: uri
            nullable: true
      meta:
        type: object
        properties:
          current_page:
            type: integer
            example: 1
          from:
            type: integer
            nullable: true
            example: 1
          last_page:
            type: integer
            example: 1
          links:
            type: array
            items:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  nullable: true
                label:
                  type: string
                page:
                  type: integer
                  nullable: true
                active:
                  type: boolean
          path:
            type: string
            format: uri
          per_page:
            type: integer
            example: 25
          to:
            type: integer
            nullable: true
            example: 1
          total:
            type: integer
            example: 1
  ParcelTrackingResponse:
    type: object
    required:
      - data
    properties:
      data:
        type: object
        properties:
          reference:
            type: string
            example: KC-20260101-00001
          status:
            type: string
            example: withdrawn
          origin:
            type: string
            nullable: true
            example: Cotonou
          destination:
            type: string
            nullable: true
            example: Porto-Novo
          weight_grams:
            type: integer
            nullable: true
            example: 2400
          withdraw_by:
            type: string
            format: date-time
            nullable: true
          eta:
            type: string
            format: date-time
            nullable: true
          last_event_at:
            type: string
            format: date-time
            nullable: true
          timeline:
            type: array
            items:
              type: object
              properties:
                kind:
                  type: string
                observed_at:
                  type: string
                  format: date-time
                city:
                  type: string
                  nullable: true
  ParcelQuoteResponse:
    type: object
    required:
      - data
    properties:
      data:
        type: object
        properties:
          tariff_uuid:
            type: string
            format: uuid
          tariff_version:
            type: integer
          deposit_kind:
            type: string
            enum:
              - agency
              - partner_point
          weight_grams:
            type: integer
          currency:
            type: string
          maximum_grams:
            type: integer
          base_amount:
            type: integer
          step_amount:
            type: integer
          step_grams:
            type: integer
          extra_steps:
            type: integer
          tiers:
            type: array
            items:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - base
                    - step
                from_grams:
                  type: integer
                to_grams:
                  type: integer
                amount:
                  type: integer
          total:
            type: integer
          net:
            type: integer
          tax:
            type: integer
          tax_code:
            type: string
            nullable: true
          tax_rate:
            type: string
          fiscal_group:
            type: string
            nullable: true
          estimated:
            type: boolean
  ParcelMethodsResponse:
    type: object
    required:
      - data
    properties:
      data:
        type: object
        properties:
          country:
            type: string
            example: BJ
          currency:
            type: string
            example: XOF
          methods:
            type: array
            items:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - mobile_money
                    - card
                    - wallet
                label:
                  type: string
                enabled:
                  type: boolean
                availability:
                  type: string
                  nullable: true
                  example: points_only
                providers:
                  type: array
                  items:
                    type: object
                requires:
                  type: array
                  items:
                    type: string
                capabilities:
                  type: object
                  properties:
                    cash:
                      type: boolean
                    points:
                      type: boolean
                min_points_amount:
                  type: integer
                point_value_fcfa:
                  type: integer
  Payment:
    type: object
    properties:
      uuid:
        type: string
        format: uuid
      status:
        type: string
        enum:
          - pending
          - confirmed
          - failed
          - cancelled
          - refunded
      amount:
        type: integer
      currency:
        type: string
      method:
        type: string
        enum:
          - mobile_money
          - card
          - wallet
      provider:
        type: string
      provider_reference:
        type: string
        nullable: true
      provider_transaction_id:
        type: string
        nullable: true
      provider_currency:
        type: string
        nullable: true
      provider_amount:
        type: integer
        nullable: true
      mobile_money_network:
        type: string
        nullable: true
      payer_phone:
        type: string
        nullable: true
      wallet_funding:
        type: object
        properties:
          wallet_amount:
            type: integer
          points_amount:
            type: integer
          point_value_fcfa:
            type: integer
          points_value_fcfa:
            type: integer
          provider_amount_fcfa:
            type: integer
      confirmed_at:
        type: string
        format: date-time
        nullable: true
      last_verified_at:
        type: string
        format: date-time
        nullable: true
      next_action:
        type: string
        enum:
          - verify
          - show_parcel
          - contact_support
          - retry
      checkout_url:
        type: string
        format: uri
        nullable: true
      widget:
        type: object
        nullable: true
      failure:
        type: object
        nullable: true
        properties:
          code:
            type: string
            nullable: true
          message:
            type: string
            nullable: true
      expires_at:
        type: string
        format: date-time
        nullable: true
      polling_interval_seconds:
        type: integer
        example: 10
  PaymentResponse:
    type: object
    required:
      - data
    properties:
      data:
        $ref: '#/components/schemas/Payment'
  ShareResponse:
    type: object
    required:
      - data
    properties:
      data:
        type: object
        properties:
          path:
            type: string
            example: /api/v1/parcels/shared/AbCdEfGhIjKlMnOpQrStUvWxYz0123456789ABCDEFGHIJKL
  IncidentResponse:
    type: object
    required:
      - data
    properties:
      data:
        type: object
        properties:
          uuid:
            type: string
            format: uuid
          blocking:
            type: boolean
            example: false
  LabelDocument:
    type: object
    properties:
      kind:
        type: string
        enum:
          - label
      width_mm:
        type: integer
        example: 58
      reference:
        type: string
      qr_payload:
        type: string
        format: uri
      esc_pos_base64:
        type: string
        description: 'Commande ESC/POS encodée en base64, tronquée dans cet exemple.'
  ReceiptDocument:
    type: object
    properties:
      kind:
        type: string
        enum:
          - receipt
          - return_receipt
      receipt_status:
        type: string
        enum:
          - provisional
          - certified
      receipt_label:
        type: string
      reference:
        type: string
      issued_at:
        type: string
        format: date-time
        nullable: true
      currency:
        type: string
      qr_payload:
        type: string
        format: uri
      parties:
        type: object
        properties:
          sender_name:
            type: string
          sender_phone:
            type: string
          recipient_name:
            type: string
          recipient_phone:
            type: string
      route:
        type: object
        properties:
          origin:
            type: string
            nullable: true
          destination:
            type: string
            nullable: true
          corridor_uuid:
            type: string
            format: uuid
            nullable: true
      parcel:
        type: object
        properties:
          weight_grams:
            type: integer
            nullable: true
          declared_grams:
            type: integer
          contents:
            type: string
      charge:
        type: object
      payment:
        type: object
      fiscal:
        type: object
      width_mm:
        type: integer
      fiscal_status:
        type: string
      esc_pos_base64:
        type: string
        description: 'Commande ESC/POS encodée en base64, tronquée dans cet exemple.'
  ParcelDocumentResponse:
    type: object
    required:
      - data
    properties:
      data:
        oneOf:
          -
            $ref: '#/components/schemas/LabelDocument'
          -
            $ref: '#/components/schemas/ReceiptDocument'

requestBodies:
  '/api/v1/parcels/{parcel_uuid}/incidents':
    post:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - kind
              - description
            properties:
              kind:
                type: string
                enum:
                  - loss
                  - damage
                  - custody_discrepancy
                example: damage
                description: 'Nature du signalement.'
              description:
                type: string
                maxLength: 2000
                example: 'Emballage endommagé'
                description: 'Description factuelle, sans code de retrait.'
              idempotency_key:
                type: string
                format: uuid
                nullable: true
                example: 00000000-0000-4000-8000-000000000099
                description: 'Clé optionnelle pour rejouer la déclaration sans créer un second incident.'
          example:
            kind: damage
            description: 'Emballage endommagé'
            idempotency_key: 00000000-0000-4000-8000-000000000099
