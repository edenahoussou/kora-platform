name: API Docs

# Validates that the Scribe/OpenAPI documentation for the API v1 Bus endpoints
# generates without errors. Runs on every push/PR that touches API-relevant
# code, so a broken @response/@urlParam/@queryParam annotation, an invalid
# route, or a Scribe config regression fails the build instead of silently
# breaking `php artisan scribe:generate` for the next developer.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'routes/**'
      - 'config/scribe.php'
      - '.scribe/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/api-docs.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'routes/**'
      - 'config/scribe.php'
      - '.scribe/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

jobs:
  generate-docs:
    name: Generate Scribe documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Configure SQLite for docs generation
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/ci-docs.sqlite" >> .env
          touch database/ci-docs.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Generate Scribe documentation
        run: php artisan scribe:generate --force

      - name: Verify OpenAPI spec and Postman collection were produced
        run: |
          test -f storage/app/private/scribe/openapi.yaml || { echo "::error::openapi.yaml was not generated"; exit 1; }
          test -f storage/app/private/scribe/collection.json || { echo "::error::Postman collection.json was not generated"; exit 1; }
          echo "Scribe documentation generated successfully."

      - name: Upload generated docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: |
            storage/app/private/scribe/openapi.yaml
            storage/app/private/scribe/collection.json
            resources/views/scribe
          retention-days: 14
