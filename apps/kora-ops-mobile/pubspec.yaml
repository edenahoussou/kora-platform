name: kora_ops_mobile
description: "KORA OPS Mobile (P501) — application terrain pour chauffeurs bus, convoyeurs et agences KORA EXPRESS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.2

  # Networking
  dio: ^5.7.0

  # Local & secure storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Logging
  logger: ^2.5.0

  # Responsivité
  flutter_screenutil: ^5.9.3

  # Serialization
  json_annotation: ^4.9.0

  intl: ^0.19.0

  # Dialogues (succès/erreur/warning/info/confirmation/chargement)
  pro_dialog: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

  # Tests
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Widgetbook (module séparé, voir /widgetbook)

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
