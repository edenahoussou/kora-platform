name: kora_ops_mobile
description: "KORA OPS Mobile (P501) — application terrain pour chauffeurs bus, convoyeurs et agences KORA EXPRESS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.2

  # Networking
  dio: ^5.7.0

  flutter_networking:
    path: ../../packages/flutter-networking

  # Local & secure storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Identité de l'appareil courant (nom + empreinte stable) — requis par
  # /auth/login et le stockage de l'empreinte dans le stockage sécurisé.
  device_info_plus: ^10.1.2

  # Logging
  logger: ^2.5.0

  # Responsivité
  flutter_screenutil: ^5.9.3

  # Squelettes de chargement (shimmer) — voir document.md § États visuels
  shimmer: ^3.0.0

  # Vérification de connexion au démarrage (non bloquante, voir splash) —
  # voir document.md § Splash
  connectivity_plus: 

  # Base de données locale (manifeste en cache, file de sync hors ligne,
  # anti-double-scan, reprise après crash — voir MEZ-91 / document.md §
  # Base locale). Choisie plutôt que Hive/drift : robuste, transactionnelle
  # (verrous nécessaires pour l'idempotence locale), et suffit largement au
  # volume d'un terminal (un manifeste + une file d'opérations à la fois).
  sqflite: ^2.4.1
  path: ^1.9.1

  # Génération d'UUID (operation_uuid, batch_uuid — voir contrats
  # MEZ-86/MEZ-88 côté backend).
  uuid: ^4.5.1

  # Scanner caméra QR — alternative au P501 en mode téléphone (voir ticket
  # "Supporter le scan par caméra téléphone en alternative au P501").
  # Réintroduit ici : jamais appelé directement par le scan boarding
  # (MEZ-91, critère "jamais par la caméra standard"), uniquement via
  # PhoneCameraBarcodeScanner, sélectionné à la place de P501BarcodeScanner
  # quand AppConfig.terminalMode == TerminalMode.phone.
  mobile_scanner: ^7.4.0

  # Aperçu + partage/impression système du PDF de confirmation
  # d'embarquement en mode téléphone (pas d'imprimante thermique — voir
  # même ticket que ci-dessus).
  printing: ^5.13.4

  # Rendu du QR code sur le billet affiché en app — voir document.md § Ticket
  qr_flutter: ^4.1.0

  # Serialization
  json_annotation: ^4.9.0

  intl: ^0.19.0

  # Dialogues (succès/erreur/warning/info/confirmation/chargement)
  pro_dialog: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

  # Tests
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Widgetbook (module séparé, voir /widgetbook)

flutter:
  uses-material-design: true
  assets:
    - assets/images/
