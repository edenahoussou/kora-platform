org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compilation incrémentale Kotlin désactivée : sous Windows, les caches
# `.tab` de `compileReleaseKotlin` restent verrouillés (antivirus,
# indexeur) et font échouer le build avec « Could not close incremental
# caches ». Sans effet sur l'APK produit ; coûte seulement du temps sur
# les rebuilds. À réactiver si le verrouillage est réglé côté poste
# (exclusion du dossier `build/` dans l'antivirus).
kotlin.incremental=false
