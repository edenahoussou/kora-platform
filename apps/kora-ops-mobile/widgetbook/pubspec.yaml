name: kora_ops_mobile_widgetbook
description: "Widgetbook — Design System KORA OPS Mobile"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^3.10.0
  # Réutilise directement les composants et le thème de l'application —
  # jamais de copie de composant spécifique à Widgetbook (voir spec § 15).
  kora_ops_mobile:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
