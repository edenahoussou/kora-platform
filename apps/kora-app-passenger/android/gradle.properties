org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Désactivé : le compilateur Kotlin incrémental plante quand le projet
# (D:\...) et le cache Pub/Gradle (C:\Users\...) sont sur des lettres de
# lecteur différentes ("this and base files have different roots").
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9 coupe `resValue` par défaut, et le drapeau `buildFeatures` du
# module ne suffit pas : la fonctionnalité se rouvre ici, globalement.
# Les identifiants Facebook en dépendent (voir app/build.gradle.kts).
android.defaults.buildfeatures.resvalues=true
