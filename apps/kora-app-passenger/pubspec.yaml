name: kora_app_passenger
description: "KORA EXPRESS — application mobile Passager (Clean Architecture + Bloc)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Traductions officielles des widgets Material (sélecteur de date,
  # actions d'accessibilité...) : sans ça, `showDatePicker` s'afficherait
  # en anglais dans une app entièrement française.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Formatage dates / nombres (fr_FR) ---
  # Version alignée sur celle qu'impose flutter_localizations.
  intl: any

  # --- State management ---
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # --- Réseau ---
  # Ces 2 lignes restent nécessaires ici : injector.dart construit
  # directement un Dio/FlutterSecureStorage pour les passer au DioClient
  # du package flutter_networking (voir plus bas).
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # --- Injection de dépendances (Clean Architecture) ---
  get_it: ^7.7.0

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Stockage ---
  shared_preferences: ^2.3.2      # préférences simples (thème, réglages non sensibles)
  flutter_secure_storage: ^9.2.2  # données sensibles (tokens d'authentification)

  # Identifie l'appareil auprès de l'API : `register/complete` et `login`
  # exigent un `device_fingerprint` stable, c'est lui qui permet de sauter
  # l'OTP sur un appareil déjà connu.
  device_info_plus: ^10.1.2

  # Écran « Autorisations » : demande à Android/iOS l'accès à la position
  # et aux notifications. Sans ce paquet, les interrupteurs de l'écran
  # n'ouvriraient aucune boîte de dialogue système.
  permission_handler: ^11.3.1

  # --- Gestion d'erreurs fonctionnelle (Either<Failure, T>) ---
  dartz: ^0.10.1

  # --- Modèles immuables / sérialisation JSON ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # --- Packages internes du monorepo KORA (voir KORA/packages/) ---
  flutter_design_system:
    path: ../../packages/flutter-design-system
  flutter_networking:
    path: ../../packages/flutter-networking
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.5
  url_launcher: ^6.3.2

  # Dessine les QR des billets. `qr_code` de l'API est une charge à
  # encoder, pas une image : sans cette bibliothèque aucun billet de l'app
  # n'est scannable au contrôle.
  qr_flutter: ^4.1.0
  pdf: ^3.13.0
  printing: ^5.15.0
  file_saver: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Tests ---
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # --- Génération de code (freezed / json_serializable) ---
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Les icônes nav/véhicules ne sont plus déclarées ici : elles vivent
  # dans packages/flutter-design-system et sont bundlées automatiquement
  # dès que l'app dépend de ce package.
  assets:
    - assets/images/
    - assets/languages/

  # Pour ajouter la police Aptos plus tard (voir GUIDE.md, section design
  # system) : ça se passe dans packages/flutter-design-system, pas ici.
