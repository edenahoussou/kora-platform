server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php index.html;

    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Mailpit staging inbox (protected by the host reverse proxy)
    location = /mailpit {
        return 301 /mailpit/;
    }

    location ^~ /mailpit/ {
        # Resolution DNS dynamique via le DNS embarque Docker :
        # evite le 502 quand le container mailpit est recree sur une nouvelle IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mailpit_upstream http://mailpit:8025;
        proxy_pass $mailpit_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Laravel pretty URLs + Inertia SPA fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compiles par Vite (cache long)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fichiers statiques Laravel
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;

        # Buffers élargis pour les headers Laravel (session + Inertia + CSRF)
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }

    # Refuser l'acces aux fichiers sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /(\.git|\.env|composer\.(json|lock)|package(-lock)?\.json|artisan) {
        deny all;
    }
}
