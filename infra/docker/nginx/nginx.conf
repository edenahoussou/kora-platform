server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php index.html;

    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Laravel pretty URLs + Inertia SPA fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compiles par Vite (cache long)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fichiers statiques Laravel
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # Refuser l'acces aux fichiers sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /(\.git|\.env|composer\.(json|lock)|package(-lock)?\.json|artisan) {
        deny all;
    }
}
