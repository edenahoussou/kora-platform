openapi: 3.0.3
info:
  title: 'Kora Platforme Web API Documentation'
  description: 'KORA BUS MVP REST API.'
  version: 1.0.0
servers:
  - url: 'http://kora-ops-web.local'
tags:
  - name: Bus
    description: "\nPublic Bus catalog endpoints for KORA BUS search experiences."
  - name: Endpoints
    description: ''
paths:
  /api/v1/bus/cities:
    get:
      summary: 'List served cities.'
      operationId: listServedCities
      description: 'Returns active cities derived from active Bus stops.'
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: array
                          items:
                            type: object
      tags:
        - Bus
      security: []
  /api/v1/bus/lines:
    get:
      summary: 'List Bus lines.'
      operationId: listBusLines
      description: ''
      parameters:
        -
          in: query
          name: from
          description: 'Optional origin city filter.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city filter.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter.'
            example: Abidjan
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Bus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: validation.max.
                  example: b
                  nullable: true
                to:
                  type: string
                  description: validation.max.
                  example: 'n'
                  nullable: true
      security: []
  '/api/v1/bus/lines/{uuid}':
    get:
      summary: 'Show a Bus line.'
      operationId: showABusLine
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Bus
      security: []
    parameters:
      -
        in: path
        name: uuid
        description: ''
        example: a3091549-9179-454e-8440-58179f2208df
        required: true
        schema:
          type: string
  /api/v1/bus/departures:
    get:
      summary: 'List departures.'
      operationId: listDepartures
      description: ''
      parameters:
        -
          in: query
          name: date
          description: 'Travel date in YYYY-MM-DD format.'
          example: '2026-08-15'
          required: true
          schema:
            type: string
            description: 'Travel date in YYYY-MM-DD format.'
            example: '2026-08-15'
        -
          in: query
          name: from
          description: 'Optional origin city filter.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city filter.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter.'
            example: Abidjan
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-08-17'
                from:
                  type: string
                  description: validation.max.
                  example: b
                  nullable: true
                to:
                  type: string
                  description: validation.max.
                  example: 'n'
                  nullable: true
              required:
                - date
      security: []
  '/api/v1/bus/departures/{uuid}':
    get:
      summary: 'Show a departure.'
      operationId: showADeparture
      description: ''
      parameters:
        -
          in: query
          name: from
          description: 'Optional origin city.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city.'
            example: Abidjan
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Bus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: validation.max.
                  example: b
                  nullable: true
                to:
                  type: string
                  description: validation.max.
                  example: 'n'
                  nullable: true
      security: []
    parameters:
      -
        in: path
        name: uuid
        description: ''
        example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
        required: true
        schema:
          type: string
  '/api/v1/bus/departures/{departure_uuid}/seats':
    get:
      summary: 'List departure seats.'
      operationId: listDepartureSeats
      description: ''
      parameters:
        -
          in: query
          name: origin_stop_uuid
          description: 'Public UUID of the boarding stop.'
          example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
          required: true
          schema:
            type: string
            description: 'Public UUID of the boarding stop.'
            example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
        -
          in: query
          name: destination_stop_uuid
          description: 'Public UUID of the drop-off stop.'
          example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
          required: true
          schema:
            type: string
            description: 'Public UUID of the drop-off stop.'
            example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin_stop_uuid:
                  type: string
                  description: validation.uuid.
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                destination_stop_uuid:
                  type: string
                  description: validation.uuid.
                  example: 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
              required:
                - origin_stop_uuid
                - destination_stop_uuid
      security: []
    parameters:
      -
        in: path
        name: departure_uuid
        description: ''
        example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
        required: true
        schema:
          type: string
  /api/v1/health:
    get:
      summary: 'Full application health: database, cache (Redis), and API version.'
      operationId: fullApplicationHealthDatabaseCacheRedisAndAPIVersion
      description: "Returns 200 when every dependency is reachable, 503 otherwise so load\nbalancers and monitoring can drain traffic from an unhealthy instance."
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      security: []
  /api/v1/health/ping:
    get:
      summary: "Lightweight liveness probe for load balancers: always 200 when the\nprocess can answer, with no dependency checks."
      operationId: lightweightLivenessProbeForLoadBalancersAlways200WhenTheProcessCanAnswerWithNoDependencyChecks
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      security: []
  /api/v1/auth/otp/request:
    post:
      summary: ''
      operationId: postApiV1AuthOtpRequest
      description: ''
      parameters: []
      responses:
              '202':
                description: 'Request accepted, action pending.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: gbailey@example.net
                purpose:
                  type: string
                  description: ''
                  example: registration
                  enum:
                    - registration
                    - login_new_device
                    - pin_reset
                    - account_unlock
              required:
                - email
                - purpose
      security: []
  /api/v1/auth/otp/verify:
    post:
      summary: ''
      operationId: postApiV1AuthOtpVerify
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_challenge_uuid:
                  type: string
                  description: validation.uuid.
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                purpose:
                  type: string
                  description: ''
                  example: account_unlock
                  enum:
                    - registration
                    - login_new_device
                    - pin_reset
                    - account_unlock
                code:
                  type: string
                  description: validation.digits.
                  example: '569775'
              required:
                - otp_challenge_uuid
                - purpose
                - code
      security: []
  /api/v1/auth/pin/reset:
    post:
      summary: ''
      operationId: postApiV1AuthPinReset
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_challenge_uuid:
                  type: string
                  description: validation.uuid.
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                verification_token:
                  type: string
                  description: validation.size.
                  example: gzmiyvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbewtn
                pin:
                  type: string
                  description: validation.digits.
                  example: '9775'
              required:
                - otp_challenge_uuid
                - verification_token
                - pin
      security: []
  /api/v1/auth/unlock:
    post:
      summary: ''
      operationId: postApiV1AuthUnlock
      description: ''
      parameters: []
      responses:
              '202':
                description: 'Request accepted, action pending.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_challenge_uuid:
                  type: string
                  description: validation.uuid.
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                verification_token:
                  type: string
                  description: validation.size.
                  example: gzmiyvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbewtn
              required:
                - otp_challenge_uuid
                - verification_token
      security: []
  /api/v1/auth/register/complete:
    post:
      summary: ''
      operationId: postApiV1AuthRegisterComplete
      description: ''
      parameters: []
      responses:
              '201':
                description: 'Resource created.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_challenge_uuid:
                  type: string
                  description: validation.uuid.
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                verification_token:
                  type: string
                  description: validation.size.
                  example: gzmiyvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbewtn
                pin:
                  type: string
                  description: validation.digits.
                  example: '9775'
                device_name:
                  type: string
                  description: validation.max.
                  example: 'n'
                platform:
                  type: string
                  description: ''
                  example: web
                  enum:
                    - android
                    - ios
                    - web
                    - unknown
                device_fingerprint:
                  type: string
                  description: 'validation.min validation.max.'
                  example: g
                push_token:
                  type: string
                  description: validation.max.
                  example: z
                  nullable: true
              required:
                - otp_challenge_uuid
                - verification_token
                - pin
                - device_name
                - platform
                - device_fingerprint
      security: []
  /api/v1/auth/login:
    post:
      summary: ''
      operationId: postApiV1AuthLogin
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: gbailey@example.net
                pin:
                  type: string
                  description: validation.digits.
                  example: '9775'
                device_name:
                  type: string
                  description: validation.max.
                  example: 'n'
                platform:
                  type: string
                  description: ''
                  example: ios
                  enum:
                    - android
                    - ios
                    - web
                    - unknown
                device_fingerprint:
                  type: string
                  description: 'validation.min validation.max.'
                  example: g
                push_token:
                  type: string
                  description: validation.max.
                  example: z
                  nullable: true
                otp_challenge_uuid:
                  type: string
                  description: 'This field is required when <code>verification_token</code> is present. validation.uuid.'
                  example: 977e5426-8d13-3824-86aa-b092f8ae52c5
                  nullable: true
                verification_token:
                  type: string
                  description: 'This field is required when <code>otp_challenge_uuid</code> is present. validation.size.'
                  example: yvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbewtnnoqi
                  nullable: true
              required:
                - email
                - pin
                - device_name
                - platform
                - device_fingerprint
      security: []
  /api/v1/auth/me:
    get:
      summary: ''
      operationId: getApiV1AuthMe
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      security: []
    put:
      summary: ''
      operationId: putApiV1AuthMe
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: validation.max.
                  example: b
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: zbailey@example.net
                phone:
                  type: string
                  description: validation.max.
                  example: iyvdljnikhwaykcm
                  nullable: true
                country_code:
                  type: string
                  description: validation.max.
                  example: yuwp
                  nullable: true
                birth_date:
                  type: string
                  description: 'validation.date validation.before.'
                  example: '2022-09-10'
                  nullable: true
              required:
                - name
                - email
      security: []
  /api/v1/auth/pin/change:
    post:
      summary: ''
      operationId: postApiV1AuthPinChange
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_pin:
                  type: string
                  description: validation.digits.
                  example: '9775'
                new_pin:
                  type: string
                  description: 'validation.digits Must not be one of <code></code>.'
                  example: '9775'
              required:
                - current_pin
                - new_pin
      security: []
  /api/v1/auth/preferences:
    get:
      summary: ''
      operationId: getApiV1AuthPreferences
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      security: []
    put:
      summary: ''
      operationId: putApiV1AuthPreferences
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                push_notifications:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
                whatsapp_notifications:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                email_notifications:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
                locale:
                  type: string
                  description: ''
                  example: en
                  enum:
                    - fr
                    - en
                  nullable: true
                theme:
                  type: string
                  description: ''
                  example: system
                  enum:
                    - light
                    - dark
                    - system
                  nullable: true
      security: []
  /api/v1/auth/devices:
    get:
      summary: ''
      operationId: getApiV1AuthDevices
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: array
                          items:
                            type: object
      tags:
        - Endpoints
      security: []
  '/api/v1/auth/devices/{uuid}':
    delete:
      summary: ''
      operationId: deleteApiV1AuthDevicesUuid
      description: ''
      parameters: []
      responses:
              '204':
                description: 'No content.'
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: uuid
        description: ''
        example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
        required: true
        schema:
          type: string
  /api/v1/auth/logout:
    post:
      summary: ''
      operationId: postApiV1AuthLogout
      description: ''
      parameters: []
      responses:
              '200':
                description: 'Successful response.'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        data:
                          type: object
      tags:
        - Endpoints
      security: []
