    post:
      summary: 'Resume online payment on the same reservation.'
      operationId: resumeOnlinePaymentOnTheSameReservation
      description: "Arbitrates against a concurrent agency claim: only valid while the\ndossier is still `pending`. The quote is recalculated and the seats\nare re-acquired atomically on the same itinerary — the first\nsuccessful operation wins and the loser gets a 409 conflict."
