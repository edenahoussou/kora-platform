openapi: 3.0.3
info:
  title: 'Kora Platforme Web API Documentation'
  description: 'KORA BUS MVP REST API.'
  version: 1.0.0
servers:
  -
    url: 'https://staging.koraexpress.app'
tags:
  -
    name: Bus
    description: "\nPublic Bus catalog endpoints for KORA BUS search experiences."
  -
    name: Auth
    description: "\nOTP challenge request and verification for registration, login, PIN reset and account unlock."
  -
    name: 'Company Accounts'
    description: "\nCompany account management for group purchases and credit-based billing."
  -
    name: 'Group Discounts'
    description: "\nGroup discount rule management and group booking settings."
  -
    name: Health
    description: "\nApplication health and liveness probes for load balancers and monitoring."
  -
    name: Payments
    description: "\nPayment lifecycle endpoints: initiation, polling status, and provider webhook confirmation."
  -
    name: Tickets
    description: "\nTicket retrieval endpoints for issued boarding passes."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/bus/cities:
    get:
      summary: 'List served cities.'
      operationId: listServedCities
      description: "Returns active cities with their physical stops, ready for itinerary search.\nEach physical stop exposes its UUID, which the mobile uses as\n`from_physical_stop_uuid` / `to_physical_stop_uuid` in `GET /bus/itineraries`."
      parameters: []
      responses:
        200:
          description: 'Cities list'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      city: Cotonou
                      country: BJ
                      physical_stops:
                        -
                          uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                          name: 'Cotonou · St Michel'
                        -
                          uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                          name: 'Cotonou · Dantokpa'
                    -
                      city: Abidjan
                      country: CI
                      physical_stops:
                        -
                          uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e23
                          name: 'Abidjan · Adjamé'
                properties:
                  data:
                    type: array
                    example:
                      -
                        city: Cotonou
                        country: BJ
                        physical_stops:
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                            name: 'Cotonou · St Michel'
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                            name: 'Cotonou · Dantokpa'
                      -
                        city: Abidjan
                        country: CI
                        physical_stops:
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e23
                            name: 'Abidjan · Adjamé'
                    items:
                      type: object
                      properties:
                        city:
                          type: string
                          example: Cotonou
                        country:
                          type: string
                          example: BJ
                        physical_stops:
                          type: array
                          example:
                            -
                              uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                              name: 'Cotonou · St Michel'
                            -
                              uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                              name: 'Cotonou · Dantokpa'
                          items:
                            type: object
                            properties:
                              uuid:
                                type: string
                                example: 00000000-0000-4000-8000-000000000000
                              name:
                                type: string
                                example: 'Cotonou · St Michel'
      tags:
        - Bus
      security: []
  /api/v1/bus/lines:
    get:
      summary: 'List Bus lines.'
      operationId: listBusLines
      description: ''
      parameters:
        -
          in: query
          name: from
          description: 'Optional origin city filter.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city filter.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter.'
            example: Abidjan
      responses:
        200:
          description: 'Lines list'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                      code: L1
                      name: 'Cotonou - Abidjan'
                      type: internationale
                      countries_crossed:
                        - BJ
                        - TG
                        - GH
                        - CI
                      distance_km: 1020
                      estimated_duration_minutes: 1260
                      status: active
                      stops: []
                properties:
                  data:
                    type: array
                    example:
                      -
                        uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                        code: L1
                        name: 'Cotonou - Abidjan'
                        type: internationale
                        countries_crossed:
                          - BJ
                          - TG
                          - GH
                          - CI
                        distance_km: 1020
                        estimated_duration_minutes: 1260
                        status: active
                        stops: []
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: 00000000-0000-4000-8000-000000000000
                        code:
                          type: string
                          example: L1
                        name:
                          type: string
                          example: 'Cotonou - Abidjan'
                        type:
                          type: string
                          example: internationale
                        countries_crossed:
                          type: array
                          example:
                            - BJ
                            - TG
                            - GH
                            - CI
                          items:
                            type: string
                        distance_km:
                          type: integer
                          example: 1020
                        estimated_duration_minutes:
                          type: integer
                          example: 1260
                        status:
                          type: string
                          example: active
                        stops:
                          type: array
                          example: []
      tags:
        - Bus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 120 caractères.'
                  example: b
                  nullable: true
                to:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 120 caractères.'
                  example: 'n'
                  nullable: true
      security: []
  '/api/v1/bus/lines/{uuid}':
    get:
      summary: 'Show a Bus line.'
      operationId: showABusLine
      description: "Includes the line's active stops, ordered along the route."
      parameters: []
      responses:
        200:
          description: 'Line detail'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                    code: L1
                    name: 'Cotonou - Abidjan'
                    type: internationale
                    countries_crossed:
                      - BJ
                      - TG
                      - GH
                      - CI
                    distance_km: 1020
                    estimated_duration_minutes: 1260
                    status: active
                    stops:
                      -
                        uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                        name: 'Cotonou · St Michel'
                        city: Cotonou
                        country: BJ
                        stop_order: 1
                        km_from_origin: 0
                      -
                        uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                        name: 'Abidjan · Adjamé'
                        city: Abidjan
                        country: CI
                        stop_order: 2
                        km_from_origin: 1020
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      code:
                        type: string
                        example: L1
                      name:
                        type: string
                        example: 'Cotonou - Abidjan'
                      type:
                        type: string
                        example: internationale
                      countries_crossed:
                        type: array
                        example:
                          - BJ
                          - TG
                          - GH
                          - CI
                        items:
                          type: string
                      distance_km:
                        type: integer
                        example: 1020
                      estimated_duration_minutes:
                        type: integer
                        example: 1260
                      status:
                        type: string
                        example: active
                      stops:
                        type: array
                        example:
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                            name: 'Cotonou · St Michel'
                            city: Cotonou
                            country: BJ
                            stop_order: 1
                            km_from_origin: 0
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                            name: 'Abidjan · Adjamé'
                            city: Abidjan
                            country: CI
                            stop_order: 2
                            km_from_origin: 1020
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              example: 00000000-0000-4000-8000-000000000000
                            name:
                              type: string
                              example: 'Cotonou · St Michel'
                            city:
                              type: string
                              example: Cotonou
                            country:
                              type: string
                              example: BJ
                            stop_order:
                              type: integer
                              example: 1
                            km_from_origin:
                              type: integer
                              example: 0
        404:
          description: 'Line not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Modules\BusNetwork\Models\Line].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Modules\BusNetwork\Models\Line].'
      tags:
        - Bus
      security: []
    parameters:
      -
        in: path
        name: uuid
        description: ''
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
      -
        in: path
        name: line
        description: 'Public UUID of the line.'
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
  '/api/v1/bus/departures/{departure_uuid}/seats':
    get:
      summary: 'List departure seats.'
      operationId: listDepartureSeats
      description: "Returns every seat on the assigned bus, with its availability status for\nthe requested origin/destination segment (available, held, occupied, or blocked)."
      parameters:
        -
          in: query
          name: origin_stop_uuid
          description: 'Public UUID of the boarding stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'Public UUID of the boarding stop.'
            example: 00000000-0000-4000-8000-000000000000
        -
          in: query
          name: destination_stop_uuid
          description: 'Public UUID of the drop-off stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'Public UUID of the drop-off stop.'
            example: 00000000-0000-4000-8000-000000000000
      responses:
        200:
          description: 'Seat map'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e50
                      code: 1A
                      type: standard
                      sellable: true
                      availability_status: available
                      held_until: null
                    -
                      uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e51
                      code: 1B
                      type: standard
                      sellable: true
                      availability_status: held
                      held_until: '2026-08-15T07:20:00.000000Z'
                    -
                      uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e52
                      code: 1C
                      type: standard
                      sellable: true
                      availability_status: occupied
                      held_until: null
                properties:
                  data:
                    type: array
                    example:
                      -
                        uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e50
                        code: 1A
                        type: standard
                        sellable: true
                        availability_status: available
                        held_until: null
                      -
                        uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e51
                        code: 1B
                        type: standard
                        sellable: true
                        availability_status: held
                        held_until: '2026-08-15T07:20:00.000000Z'
                      -
                        uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e52
                        code: 1C
                        type: standard
                        sellable: true
                        availability_status: occupied
                        held_until: null
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: 00000000-0000-4000-8000-000000000000
                        code:
                          type: string
                          example: 1A
                        type:
                          type: string
                          example: standard
                        sellable:
                          type: boolean
                          example: false
                        availability_status:
                          type: string
                          example: available
                        held_until:
                          type: string
                          example: null
                          nullable: true
        422:
          description: 'Invalid segment'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The requested origin and destination do not form a valid ordered segment for this line.'
                  errors:
                    segment:
                      - 'The requested origin and destination do not form a valid ordered segment for this line.'
                properties:
                  message:
                    type: string
                    example: 'The requested origin and destination do not form a valid ordered segment for this line.'
                  errors:
                    type: object
                    properties:
                      segment:
                        type: array
                        example:
                          - 'The requested origin and destination do not form a valid ordered segment for this line.'
                        items:
                          type: string
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin_stop_uuid:
                  type: string
                  description: 'Le champ value doit être un UUID valide.'
                  example: 00000000-0000-4000-8000-000000000000
                destination_stop_uuid:
                  type: string
                  description: 'Le champ value doit être un UUID valide.'
                  example: 00000000-0000-4000-8000-000000000000
              required:
                - origin_stop_uuid
                - destination_stop_uuid
      security: []
    parameters:
      -
        in: path
        name: departure_uuid
        description: ''
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
      -
        in: path
        name: departure
        description: 'Public UUID of the departure.'
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
  /api/v1/bus/itineraries:
    get:
      summary: 'Search for multi-line itineraries (direct and with connections).'
      operationId: searchForMultiLineItinerariesdirectAndWithConnections
      description: "Returns rich leg data (line, bus with amenities, origin/destination stops\nwith city and country, available seats count, service class) so the\nmobile client can render search results without extra calls."
      parameters:
        -
          in: query
          name: from_physical_stop_uuid
          description: 'UUID of the origin physical stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'UUID of the origin physical stop.'
            example: 00000000-0000-4000-8000-000000000000
        -
          in: query
          name: to_physical_stop_uuid
          description: 'UUID of the destination physical stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'UUID of the destination physical stop.'
            example: 00000000-0000-4000-8000-000000000000
        -
          in: query
          name: date
          description: 'Travel date (Y-m-d).'
          example: architecto
          required: true
          schema:
            type: string
            description: 'Travel date (Y-m-d).'
            example: architecto
        -
          in: query
          name: passenger_count
          description: 'Number of passengers. Defaults to 1.'
          example: 16
          required: false
          schema:
            type: integer
            description: 'Number of passengers. Defaults to 1.'
            example: 16
        -
          in: query
          name: sort
          description: 'Sort key: departure_time, arrival_time, price, duration, connections. Defaults to connections.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Sort key: departure_time, arrival_time, price, duration, connections. Defaults to connections.'
            example: architecto
        -
          in: query
          name: sort_direction
          description: 'Sort direction: asc or desc. Defaults to asc.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Sort direction: asc or desc. Defaults to asc.'
            example: architecto
        -
          in: query
          name: service_class_code
          description: 'Filter by service class code (e.g. standard, confort).'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Filter by service class code (e.g. standard, confort).'
            example: architecto
        -
          in: query
          name: trip_type
          description: 'Trip type: one_way or round_trip. Defaults to one_way. When round_trip, return_date is required and the response shape changes to { outbound: [...], inbound: [...] }.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Trip type: one_way or round_trip. Defaults to one_way. When round_trip, return_date is required and the response shape changes to { outbound: [...], inbound: [...] }.'
            example: architecto
        -
          in: query
          name: return_date
          description: 'Return date (Y-m-d). Required when trip_type is round_trip.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Return date (Y-m-d). Required when trip_type is round_trip.'
            example: architecto
      responses:
        200:
          description: 'One-way itineraries'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      connections_count: 0
                      total_amount: 15600
                      currency: XOF
                      departure_at: '2026-09-07T13:00:00+00:00'
                      arrival_at: '2026-09-07T23:00:00+00:00'
                      connection_margin_minutes: 45
                      legs:
                        -
                          leg_order: 1
                          departure_uuid: eaaf800b-90b6-4334-b840-7122d9ed65ac
                          line:
                            uuid: line-uuid
                            code: L2
                            name: 'Cotonou - Malanville'
                            estimated_duration_minutes: 600
                            is_international: false
                          bus:
                            uuid: bus-uuid
                            registration_number: BJ-1234-AA
                            brand: Toyota
                            model: Coaster
                            seat_count: 30
                            amenities:
                              -
                                code: wifi
                                label: Wi-Fi
                                icon: wifi
                          origin_stop:
                            uuid: stop-uuid
                            name: Cotonou
                            city: Cotonou
                            country: BJ
                            stop_order: 1
                          destination_stop:
                            uuid: stop-uuid
                            name: Malanville
                            city: Malanville
                            country: BJ
                            stop_order: 7
                          amount: 15600
                          available_seats_count: 28
                          service_class_code: standard
                          service_class_name: Standard
                          departure_at: '2026-09-07T13:00:00+00:00'
                          arrival_at: '2026-09-07T23:00:00+00:00'
                properties:
                  data:
                    type: array
                    example:
                      -
                        connections_count: 0
                        total_amount: 15600
                        currency: XOF
                        departure_at: '2026-09-07T13:00:00+00:00'
                        arrival_at: '2026-09-07T23:00:00+00:00'
                        connection_margin_minutes: 45
                        legs:
                          -
                            leg_order: 1
                            departure_uuid: eaaf800b-90b6-4334-b840-7122d9ed65ac
                            line:
                              uuid: line-uuid
                              code: L2
                              name: 'Cotonou - Malanville'
                              estimated_duration_minutes: 600
                              is_international: false
                            bus:
                              uuid: bus-uuid
                              registration_number: BJ-1234-AA
                              brand: Toyota
                              model: Coaster
                              seat_count: 30
                              amenities:
                                -
                                  code: wifi
                                  label: Wi-Fi
                                  icon: wifi
                            origin_stop:
                              uuid: stop-uuid
                              name: Cotonou
                              city: Cotonou
                              country: BJ
                              stop_order: 1
                            destination_stop:
                              uuid: stop-uuid
                              name: Malanville
                              city: Malanville
                              country: BJ
                              stop_order: 7
                            amount: 15600
                            available_seats_count: 28
                            service_class_code: standard
                            service_class_name: Standard
                            departure_at: '2026-09-07T13:00:00+00:00'
                            arrival_at: '2026-09-07T23:00:00+00:00'
                    items:
                      type: object
                      properties:
                        connections_count:
                          type: integer
                          example: 0
                        total_amount:
                          type: integer
                          example: 15600
                        currency:
                          type: string
                          example: XOF
                        departure_at:
                          type: string
                          example: '2026-09-07T13:00:00+00:00'
                        arrival_at:
                          type: string
                          example: '2026-09-07T23:00:00+00:00'
                        connection_margin_minutes:
                          type: integer
                          example: 45
                        legs:
                          type: array
                          example:
                            -
                              leg_order: 1
                              departure_uuid: eaaf800b-90b6-4334-b840-7122d9ed65ac
                              line:
                                uuid: line-uuid
                                code: L2
                                name: 'Cotonou - Malanville'
                                estimated_duration_minutes: 600
                                is_international: false
                              bus:
                                uuid: bus-uuid
                                registration_number: BJ-1234-AA
                                brand: Toyota
                                model: Coaster
                                seat_count: 30
                                amenities:
                                  -
                                    code: wifi
                                    label: Wi-Fi
                                    icon: wifi
                              origin_stop:
                                uuid: stop-uuid
                                name: Cotonou
                                city: Cotonou
                                country: BJ
                                stop_order: 1
                              destination_stop:
                                uuid: stop-uuid
                                name: Malanville
                                city: Malanville
                                country: BJ
                                stop_order: 7
                              amount: 15600
                              available_seats_count: 28
                              service_class_code: standard
                              service_class_name: Standard
                              departure_at: '2026-09-07T13:00:00+00:00'
                              arrival_at: '2026-09-07T23:00:00+00:00'
                          items:
                            type: object
                            properties:
                              leg_order:
                                type: integer
                                example: 1
                              departure_uuid:
                                type: string
                                example: 00000000-0000-4000-8000-000000000000
                              line:
                                type: object
                                properties:
                                  uuid:
                                    type: string
                                    example: line-uuid
                                  code:
                                    type: string
                                    example: L2
                                  name:
                                    type: string
                                    example: 'Cotonou - Malanville'
                                  estimated_duration_minutes:
                                    type: integer
                                    example: 600
                                  is_international:
                                    type: boolean
                                    example: false
                              bus:
                                type: object
                                properties:
                                  uuid:
                                    type: string
                                    example: bus-uuid
                                  registration_number:
                                    type: string
                                    example: BJ-1234-AA
                                  brand:
                                    type: string
                                    example: Toyota
                                  model:
                                    type: string
                                    example: Coaster
                                  seat_count:
                                    type: integer
                                    example: 30
                                  amenities:
                                    type: array
                                    example:
                                      - { code: wifi, label: Wi-Fi, icon: wifi }
                                    items:
                                      type: object
                                      properties: { code: { type: string, example: wifi }, label: { type: string, example: Wi-Fi }, icon: { type: string, example: wifi } }
                              origin_stop:
                                type: object
                                properties:
                                  uuid:
