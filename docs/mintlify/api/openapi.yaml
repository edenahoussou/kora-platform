  /api/v1/health:
    get:
      summary: 'Full application health: database, cache (Redis), and API version.'
      operationId: fullApplicationHealthDatabaseCacheRedisAndAPIVersion
      description: "Returns 200 when every dependency is reachable, 503 otherwise so load\nbalancers and monitoring can drain traffic from an unhealthy instance."
      parameters: []
      responses:
        200:
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                  service: kora-ops-web
                  scope: bus
                  version: v1
                  timestamp: '2026-09-02T10:00:00.000Z'
                  checks:
                    database:
                      status: ok
                      latency_ms: 3
                    cache:
                      status: ok
                      latency_ms: 1
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: kora-ops-web
                  scope:
                    type: string
                    example: bus
                  version:
                    type: string
                    example: v1
                  timestamp:
                    type: string
                    example: '2026-09-02T10:00:00.000Z'
                  checks:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          latency_ms:
                            type: integer
                            example: 3
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          latency_ms:
                            type: integer
                            example: 1
        503:
          description: Degraded
          content:
            application/json:
              schema:
                type: object
                example:
                  status: degraded
                  service: kora-ops-web
                  scope: bus
                  version: v1
                  timestamp: '2026-09-02T10:00:00.000Z'
                  checks:
                    database:
                      status: error
                      latency_ms: null
                    cache:
                      status: ok
                      latency_ms: 1
                properties:
                  status:
                    type: string
                    example: degraded
                  service:
                    type: string
                    example: kora-ops-web
                  scope:
                    type: string
                    example: bus
                  version:
                    type: string
                    example: v1
                  timestamp:
                    type: string
                    example: '2026-09-02T10:00:00.000Z'
                  checks:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                            example: error
                          latency_ms:
                            type: string
                            example: null
                            nullable: true
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          latency_ms:
                            type: integer
                            example: 1
      tags:
        - Health
      security: []
