openapi: 3.0.3
info:
  title: 'KORA PLATEFORME WEB API Documentation'
  description: 'KORA BUS MVP REST API.'
  version: 1.0.0
servers:
  -
    url: 'http://kora-ops-web.local'
tags:
  -
    name: Bus
    description: "\nPublic Bus catalog endpoints for KORA BUS search experiences."
  -
    name: Auth
    description: "\nOTP challenge request and verification for registration, login, PIN reset and account unlock."
  -
    name: Endpoints
    description: ''
  -
    name: Health
    description: "\nApplication health and liveness probes for load balancers and monitoring."
  -
    name: Payments
    description: "\nPayment lifecycle endpoints: initiation, polling status, and provider webhook confirmation."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/bus/cities:
    get:
      summary: 'List served cities.'
      operationId: listServedCities
      description: 'Returns active cities derived from active Bus stops.'
      parameters: []
      responses:
        200:
          description: 'Cities list'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      city: Cotonou
                      country: BJ
                      stops_count: 4
                    -
                      city: Abidjan
                      country: CI
                      stops_count: 2
                properties:
                  data:
                    type: array
                    example:
                      -
                        city: Cotonou
                        country: BJ
                        stops_count: 4
                      -
                        city: Abidjan
                        country: CI
                        stops_count: 2
                    items:
                      type: object
                      properties:
                        city:
                          type: string
                          example: Cotonou
                        country:
                          type: string
                          example: BJ
                        stops_count:
                          type: integer
                          example: 4
      tags:
        - Bus
      security: []
  /api/v1/bus/lines:
    get:
      summary: 'List Bus lines.'
      operationId: listBusLines
      description: ''
      parameters:
        -
          in: query
          name: from
          description: 'Optional origin city filter.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city filter.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter.'
            example: Abidjan
      responses:
        200:
          description: 'Lines list'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                      code: L1
                      name: 'Cotonou - Abidjan'
                      type: internationale
                      countries_crossed:
                        - BJ
                        - TG
                        - GH
                        - CI
                      distance_km: 1020
                      estimated_duration_minutes: 1260
                      status: active
                      stops: []
                properties:
                  data:
                    type: array
                    example:
                      -
                        uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                        code: L1
                        name: 'Cotonou - Abidjan'
                        type: internationale
                        countries_crossed:
                          - BJ
                          - TG
                          - GH
                          - CI
                        distance_km: 1020
                        estimated_duration_minutes: 1260
                        status: active
                        stops: []
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                        code:
                          type: string
                          example: L1
                        name:
                          type: string
                          example: 'Cotonou - Abidjan'
                        type:
                          type: string
                          example: internationale
                        countries_crossed:
                          type: array
                          example:
                            - BJ
                            - TG
                            - GH
                            - CI
                          items:
                            type: string
                        distance_km:
                          type: integer
                          example: 1020
                        estimated_duration_minutes:
                          type: integer
                          example: 1260
                        status:
                          type: string
                          example: active
                        stops:
                          type: array
                          example: []
      tags:
        - Bus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 120 caractères.'
                  example: b
                  nullable: true
                to:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 120 caractères.'
                  example: 'n'
                  nullable: true
      security: []
  '/api/v1/bus/lines/{uuid}':
    get:
      summary: 'Show a Bus line.'
      operationId: showABusLine
      description: "Includes the line's active stops, ordered along the route."
      parameters: []
      responses:
        200:
          description: 'Line detail'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                    code: L1
                    name: 'Cotonou - Abidjan'
                    type: internationale
                    countries_crossed:
                      - BJ
                      - TG
                      - GH
                      - CI
                    distance_km: 1020
                    estimated_duration_minutes: 1260
                    status: active
                    stops:
                      -
                        uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                        name: 'Cotonou · St Michel'
                        city: Cotonou
                        country: BJ
                        stop_order: 1
                        km_from_origin: 0
                      -
                        uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                        name: 'Abidjan · Adjamé'
                        city: Abidjan
                        country: CI
                        stop_order: 2
                        km_from_origin: 1020
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                      code:
                        type: string
                        example: L1
                      name:
                        type: string
                        example: 'Cotonou - Abidjan'
                      type:
                        type: string
                        example: internationale
                      countries_crossed:
                        type: array
                        example:
                          - BJ
                          - TG
                          - GH
                          - CI
                        items:
                          type: string
                      distance_km:
                        type: integer
                        example: 1020
                      estimated_duration_minutes:
                        type: integer
                        example: 1260
                      status:
                        type: string
                        example: active
                      stops:
                        type: array
                        example:
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                            name: 'Cotonou · St Michel'
                            city: Cotonou
                            country: BJ
                            stop_order: 1
                            km_from_origin: 0
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                            name: 'Abidjan · Adjamé'
                            city: Abidjan
                            country: CI
                            stop_order: 2
                            km_from_origin: 1020
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              example: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                            name:
                              type: string
                              example: 'Cotonou · St Michel'
                            city:
                              type: string
                              example: Cotonou
                            country:
                              type: string
                              example: BJ
                            stop_order:
                              type: integer
                              example: 1
                            km_from_origin:
                              type: integer
                              example: 0
        404:
          description: 'Line not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Modules\BusNetwork\Models\Line].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Modules\BusNetwork\Models\Line].'
      tags:
        - Bus
      security: []
    parameters:
      -
        in: path
        name: uuid
        description: ''
        example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
        required: true
        schema:
          type: string
      -
        in: path
        name: line
        description: 'Public UUID of the line.'
        example: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
        required: true
        schema:
          type: string
  /api/v1/bus/departures:
    get:
      summary: 'List departures.'
      operationId: listDepartures
      description: 'Paginated list of scheduled departures (15 per page by default).'
      parameters:
        -
          in: query
          name: date
          description: 'Travel date in YYYY-MM-DD format.'
          example: '2026-08-15'
          required: true
          schema:
            type: string
            description: 'Travel date in YYYY-MM-DD format.'
            example: '2026-08-15'
        -
          in: query
          name: line
          description: 'Optional line UUID filter.'
          example: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
          required: false
          schema:
            type: string
            description: 'Optional line UUID filter.'
            example: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
        -
          in: query
          name: origin_city
          description: 'Optional origin city filter (alias of from).'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter (alias of from).'
            example: Cotonou
        -
          in: query
          name: destination_city
          description: 'Optional destination city filter (alias of to).'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter (alias of to).'
            example: Abidjan
        -
          in: query
          name: from
          description: 'Optional origin city filter.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city filter.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter.'
            example: Abidjan
        -
          in: query
          name: per_page
          description: 'Optional page size (max 50, default 15).'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Optional page size (max 50, default 15).'
            example: 15
        -
          in: query
          name: page
          description: 'Optional page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Optional page number.'
            example: 1
      responses:
        200:
          description: 'Departures list'
          content:
