    delete:
      summary: 'Release a seat hold.'
      operationId: releaseASeatHold
      description: "Cancels a held reservation and frees its seats immediately, before the\n15-minute hold expiry. Only the user who created the hold may release it.\nReleasing an already-released or expired hold is a no-op and still\nreturns 204.\n\nRequires a Sanctum bearer token."
      parameters: []
      responses:
        204:
          description: 'Hold released'
          content:
            text/plain:
              schema:
                type: string
                example: ''
        403:
          description: 'Reservation belongs to another user'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        404:
          description: 'Reservation not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Modules\Booking\Models\Reservation].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Modules\Booking\Models\Reservation].'
      tags:
        - Bus
    parameters:
      -
        in: path
        name: reservation_uuid
        description: ''
        example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
        required: true
        schema:
          type: string
