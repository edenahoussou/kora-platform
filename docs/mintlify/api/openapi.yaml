                    code: ticket_not_for_departure
                    message: 'Ce billet ne correspond pas à ce départ.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: ticket_not_for_departure
                      message:
                        type: string
                        example: 'Ce billet ne correspond pas à ce départ.'
      tags:
        - 'OPS Mobile — Manifest'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'Prénom corrigé. Le champ value ne doit pas dépasser 120 caractères.'
                  example: b
                last_name:
                  type: string
                  description: 'Nom de famille corrigé. Le champ value ne doit pas dépasser 120 caractères.'
                  example: 'n'
                phone:
                  type: string
                  description: 'Téléphone (normalisé en E.164 par le serveur). Le champ value ne doit pas dépasser 32 caractères.'
                  example: g
                  nullable: true
                email:
                  type: string
                  description: 'Adresse email. Le champ value doit être une adresse e-mail valide. Le champ value ne doit pas dépasser 255 caractères.'
                  example: rowan.gulgowski@example.com
                  nullable: true
                document_type:
                  type: string
                  description: 'Type de pièce : national_id, biometric_card, passport, consular_card, cip.'
                  example: national_id
                  enum:
                    - national_id
                    - biometric_card
                    - passport
                    - consular_card
                    - cip
                  nullable: true
                document_number:
                  type: string
                  description: 'Numéro de la pièce (numéro de passeport si le type est passport). Le champ value ne doit pas dépasser 64 caractères.'
                  example: d
                  nullable: true
                nationality:
                  type: string
                  description: 'Nationalité, code ISO 3166-1 alpha-2. Must contain only letters. Le champ value doit contenir 2 caractères.'
                  example: lj
                  nullable: true
                birth_date:
                  type: string
                  description: 'Date de naissance (Y-m-d). Must be a valid date in the format <code>Y-m-d</code>. Le champ value doit être une date antérieure ou égale à <code>today</code>.'
                  example: '2022-11-25'
                  nullable: true
                yellow_fever_vaccinated:
                  type: boolean
                  description: 'Vacciné contre la fièvre jaune ? null = non renseigné.'
                  example: false
                  nullable: true
                reason:
                  type: string
                  description: 'Motif de la correction (facultatif, pour l’audit). Le champ value ne doit pas dépasser 500 caractères.'
                  example: 'n'
                  nullable: true
    parameters:
