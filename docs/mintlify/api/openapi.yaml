      responses:
        '200':
          description: 'Promo code applied'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb70
                    status: held
                    total_amount: 8100
                    currency: XOF
                    promotion_discount_amount: 900
                    promotion:
                      uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6a
                      code: TESTNE10
                      name: 'Lancement Nord-Est'
                      discount_amount: 900
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      status:
                        type: string
                        example: held
                      total_amount:
                        type: integer
                        example: 8100
                      currency:
                        type: string
                        example: XOF
                      promotion_discount_amount:
                        type: integer
                        example: 900
                      promotion:
                        type: object
                        properties:
                          uuid:
                            type: string
                            example: 00000000-0000-4000-8000-000000000000
                          code:
                            type: string
                            example: TESTNE10
                          name:
                            type: string
                            example: 'Lancement Nord-Est'
                          discount_amount:
                            type: integer
                            example: 900
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        '422':
          description: 'Promo code rejected'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Ce code promotionnel est inconnu.'
                  errors:
