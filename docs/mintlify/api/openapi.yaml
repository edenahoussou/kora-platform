openapi: 3.0.3
info:
  title: 'Kora Platforme Web API Documentation'
  description: 'KORA BUS MVP REST API.'
  version: 1.0.0
servers:
  -
    url: 'https://staging.koraexpress.app'
tags:
  -
    name: Bus
    description: "\nPublic Bus catalog endpoints for KORA BUS search experiences."
  -
    name: 'Assisted Bookings'
    description: "\nAssisted booking lifecycle for the mobile app: contact central support,\ninspect the dossier, or resume online payment."
  -
    name: Auth
    description: "\nOTP challenge request and verification for registration, login, PIN reset and account unlock."
  -
    name: 'Company Accounts'
    description: "\nCompany account management for group purchases and credit-based billing."
  -
    name: 'Distribution des applications'
    description: "\nVérification de mise à jour au lancement de l'app (MEZ-150)."
  -
    name: Endpoints
    description: ''
  -
    name: 'Group Discounts'
    description: "\nGroup discount rule management and group booking settings."
  -
    name: Health
    description: "\nApplication health and liveness probes for load balancers and monitoring."
  -
    name: 'OPS Mobile — Boarding'
    description: "\nContrôle serveur d'un billet (QR signé ou code court) pour un départ et\nune jambe précis, avec idempotence par operation_uuid et détection des\nconflits entre terminaux."
  -
    name: 'OPS Mobile — Departures'
    description: "\nDéparts et manifeste pour l'équipage terrain (convoyeur, chauffeur,\nchauffeur second, mécanicien) affecté — remplace les écrans mockés de\nMEZ-11. Authentification : auth:sanctum (login existant) + terminal\nenregistré et actif (middleware terminal.active)."
  -
    name: 'OPS Mobile — Incidents'
    description: "\nSignalement d'un incident par le convoyeur (panne, retard, accident,\nsécurité, autre). Un incident déclenche une alerte : notification à\nl'équipage du départ et aux directeurs des opérations de l'agence, e-mail\naux directeurs (destinataires) et super-administrateurs (copie).\n\nIdempotent : le mobile génère `incident_uuid` ; un rejeu (coupure réseau)\nrenvoie l'incident existant (200) sans doublon ni nouvelle alerte.\nChaque convoyeur ne voit que SES incidents. Aucun identifiant numérique,\naucune donnée financière.\n\nErreurs : `{ error: { code, message } }` — `departure_not_assigned` (403),\n`incident_uuid_conflict` (409), plus les codes de session OPS."
  -
    name: 'OPS Mobile — Manifest'
    description: "\nCorrection par le convoyeur des informations d'un passager."
  -
    name: 'OPS Mobile — Progression du départ'
    description: "\nLe convoyeur fait avancer SON départ : embarquement commencé, bus parti,\narrivé, et enregistre un retard. C'est le même statut que sur OPS Web\n(`departures.status`) : un « bus parti » déclaré ici est visible côté web,\nbloque la vente du départ et débloque la clôture des no-show.\n\nRéservé à l'équipage affecté (permission `departures.progress`). Annuler\nou modifier un départ reste réservé à OPS Web."
  -
    name: 'OPS Mobile — Seat releases'
    description: "\nDescente anticipée et clôture no-show : libère les portions de siège\nnon parcourues, le serveur restant seul maître de la disponibilité et\nde la revente."
  -
    name: 'OPS Mobile — Session'
    description: "\nCycle de vie de la session OPS liée à un terminal P501 : consultation de\nl'état, renouvellement et déconnexion. L'ouverture est le handshake\n(`POST ops-mobile/terminal/handshake`).\n\nToute réponse de refus a la forme `{ error: { code, message, action, reason? } }`.\n`action` dit au mobile quoi faire :\n- `reauthenticate` : retour à l'écran de connexion (session_expired, session_revoked, session_invalid) ;\n- `open_session` : refaire le handshake (session_not_opened, terminal_mismatch) ;\n- `contact_agency` : refus durable (terminal_unknown, terminal_inactive, terminal_lost, terminal_not_assigned, role_not_authorized, permission_denied, account_suspended) ;\n- `retry_later` : refus temporaire (terminal_maintenance, account_locked).\n\n`reason` (session_revoked) : logout, terminal_deactivated, terminal_lost, terminal_maintenance,\nterminal_reassigned, account_suspended, access_removed, replaced, expired."
  -
    name: 'OPS Mobile — Suivi de la flotte'
    description: "\nIngestion par lots des positions GPS du terminal du convoyeur (ticket\nMEZ-100). Idempotent : `position_uuid` est fourni par le terminal, un\nrejeu (coupure réseau) ne crée jamais de doublon. Chaque terminal ne peut\npublier que pour sa propre session, son convoyeur et son départ autorisés\n— la garde `ops.session` lie déjà le jeton au terminal ; ce contrôleur\nvérifie en plus que le départ est bien affecté à ce convoyeur.\n\nErreurs : `{ error: { code, message } }` — `departure_not_assigned` (403),\n`departure_ended` (409, départ déjà arrivé/annulé), `too_many_positions` (422),\nplus les codes de session OPS."
  -
    name: 'OPS Mobile — Sync'
    description: "\nContrat de synchronisation pour le convoyeur en réseau dégradé ou hors\nligne : vérification de version de manifeste et soumission par lot des\nopérations enregistrées localement (embarquement, no-show, libération\nde siège). Idempotent à deux niveaux (lot et opération) — un lot\nrejoué, en tout ou partie, ne crée jamais de doublon."
  -
    name: 'OPS Mobile — Terminal'
    description: "\nHandshake et opérations liées au terminal P501 pour l'application OPS\nMobile. L'authentification de l'utilisateur (login, PIN, OTP) reste celle\nde l'app KORA existante (auth:sanctum) ; ces endpoints ajoutent le\ncontrôle du terminal par-dessus une session déjà ouverte.\n\nDistribution hors store (MEZ-150) : handshake, sync et activity\nrenvoient en plus un bloc `update` (dernière version publiée, mise à jour\nobligatoire ou non, URL de téléchargement, sha256), calculé à partir de\nl'`app_version` remontée par le terminal. Champ additionnel uniquement."
  -
    name: 'OPS Web — Suivi de la flotte'
    description: "\nPositions des départs actuellement en circulation, pour la carte OPS Web\n(ticket MEZ-100). Protégé par permission ET par périmètre : un\ngestionnaire d'agence (`tracking.view-agency`) ne voit que sa propre\nagence, un rôle réseau (`tracking.view-network`) voit toute la flotte\n(filtrable par agence). Ne retourne que des UUID, des codes métier et les\ndonnées nécessaires à la carte — aucun identifiant numérique interne."
  -
    name: 'OPS — Notifications'
    description: "\nAlertes opérationnelles boarding pour le convoyeur (OPS Mobile) et les\nopérateurs (OPS Web) : même contrat, mêmes autorisations. Chaque\nutilisateur ne voit que SES notifications ; aucune ne contient de donnée\nfinancière ni d'identifiant numérique.\n\nTypes (`type`) : departure_assigned, departure_modified, manifest_stale,\nterminal_revoked (critique), scan_conflict (critique), operation_rejected,\nsync_completed, sync_failed, no_show_closed, print_error.\n\n`action` dit au client quoi proposer : none, open_departure, refresh_manifest,\nreauthenticate, review_scan_conflict, review_rejected_operations, retry_sync,\ncheck_printer.\n\nRécupération fiable : les notifications sont persistées AVANT toute\ndiffusion temps réel. Après une coupure ou un redémarrage, le client\nappelle `GET /notifications?since=<created_at de la dernière reçue>` et\ndéduplique par `uuid`. Le temps réel (canal privé\n`ops-notifications.{user_uuid}`, événement `ops.notification.published`)\nn'est qu'un accélérateur : sans lui, rien n'est perdu.\n\nErreurs : `{ error: { code, message, action } }` — mêmes codes que les\nsessions OPS (session_expired, session_revoked, permission_denied…)."
  -
    name: 'OPS — Support'
    description: "\nExpose la configuration publique tawk.to du chat support pour l'app convoyeur."
  -
    name: 'Passager — Notifications'
    description: "\nInbox BUS du passager authentifié. Les notifications sont isolées par compte."
  -
    name: Payments
    description: "\nPayment lifecycle endpoints: initiation, polling status, and provider webhook confirmation."
  -
    name: Tickets
    description: "\nTicket retrieval endpoints for issued boarding passes."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/bus/cities:
    get:
      summary: 'List served cities.'
      operationId: listServedCities
      description: "Returns active cities with their physical stops, ready for itinerary search.\nEach physical stop exposes its UUID, which the mobile uses as\n`from_physical_stop_uuid` / `to_physical_stop_uuid` in `GET /bus/itineraries`."
      parameters: []
      responses:
        200:
          description: 'Cities list'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      city: Cotonou
                      country: BJ
                      physical_stops:
                        -
                          uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                          name: 'Cotonou · St Michel'
                        -
                          uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                          name: 'Cotonou · Dantokpa'
                    -
                      city: Abidjan
                      country: CI
                      physical_stops:
                        -
                          uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e23
                          name: 'Abidjan · Adjamé'
                properties:
                  data:
                    type: array
                    example:
                      -
                        city: Cotonou
                        country: BJ
                        physical_stops:
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                            name: 'Cotonou · St Michel'
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                            name: 'Cotonou · Dantokpa'
                      -
                        city: Abidjan
                        country: CI
                        physical_stops:
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e23
                            name: 'Abidjan · Adjamé'
                    items:
                      type: object
                      properties:
                        city:
                          type: string
                          example: Cotonou
                        country:
                          type: string
                          example: BJ
                        physical_stops:
                          type: array
                          example:
                            -
                              uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                              name: 'Cotonou · St Michel'
                            -
                              uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                              name: 'Cotonou · Dantokpa'
                          items:
                            type: object
                            properties:
                              uuid:
                                type: string
                                example: 00000000-0000-4000-8000-000000000000
                              name:
                                type: string
                                example: 'Cotonou · St Michel'
      tags:
        - Bus
      security: []
  /api/v1/bus/lines:
    get:
      summary: 'List Bus lines.'
      operationId: listBusLines
      description: ''
      parameters:
        -
          in: query
          name: from
          description: 'Optional origin city filter.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city filter.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter.'
            example: Abidjan
      responses:
        200:
          description: 'Lines list'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                      code: L1
                      name: 'Cotonou - Abidjan'
                      type: internationale
                      countries_crossed:
                        - BJ
                        - TG
                        - GH
                        - CI
                      distance_km: 1020
                      estimated_duration_minutes: 1260
                      status: active
                      stops: []
                properties:
                  data:
                    type: array
                    example:
                      -
                        uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                        code: L1
                        name: 'Cotonou - Abidjan'
                        type: internationale
                        countries_crossed:
                          - BJ
                          - TG
                          - GH
                          - CI
                        distance_km: 1020
                        estimated_duration_minutes: 1260
                        status: active
                        stops: []
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: 00000000-0000-4000-8000-000000000000
                        code:
                          type: string
                          example: L1
                        name:
                          type: string
                          example: 'Cotonou - Abidjan'
                        type:
                          type: string
                          example: internationale
                        countries_crossed:
                          type: array
                          example:
                            - BJ
                            - TG
                            - GH
                            - CI
                          items:
                            type: string
                        distance_km:
                          type: integer
                          example: 1020
                        estimated_duration_minutes:
                          type: integer
                          example: 1260
                        status:
                          type: string
                          example: active
                        stops:
                          type: array
                          example: []
      tags:
        - Bus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 120 caractères.'
                  example: b
                  nullable: true
                to:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 120 caractères.'
                  example: 'n'
                  nullable: true
      security: []
  '/api/v1/bus/lines/{uuid}':
    get:
      summary: 'Show a Bus line.'
      operationId: showABusLine
      description: "Includes the line's active stops, ordered along the route."
      parameters: []
      responses:
        200:
          description: 'Line detail'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    uuid: 9c2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e1f
                    code: L1
                    name: 'Cotonou - Abidjan'
                    type: internationale
                    countries_crossed:
                      - BJ
                      - TG
                      - GH
                      - CI
                    distance_km: 1020
                    estimated_duration_minutes: 1260
                    status: active
                    stops:
                      -
                        uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                        name: 'Cotonou · St Michel'
                        city: Cotonou
                        country: BJ
                        stop_order: 1
                        km_from_origin: 0
                      -
                        uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                        name: 'Abidjan · Adjamé'
                        city: Abidjan
                        country: CI
                        stop_order: 2
                        km_from_origin: 1020
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      code:
                        type: string
                        example: L1
                      name:
                        type: string
                        example: 'Cotonou - Abidjan'
                      type:
                        type: string
                        example: internationale
                      countries_crossed:
                        type: array
                        example:
                          - BJ
                          - TG
                          - GH
                          - CI
                        items:
                          type: string
                      distance_km:
                        type: integer
                        example: 1020
                      estimated_duration_minutes:
                        type: integer
                        example: 1260
                      status:
                        type: string
                        example: active
                      stops:
                        type: array
                        example:
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e21
                            name: 'Cotonou · St Michel'
                            city: Cotonou
                            country: BJ
                            stop_order: 1
                            km_from_origin: 0
                          -
                            uuid: 5f2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e22
                            name: 'Abidjan · Adjamé'
                            city: Abidjan
                            country: CI
                            stop_order: 2
                            km_from_origin: 1020
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              example: 00000000-0000-4000-8000-000000000000
                            name:
                              type: string
                              example: 'Cotonou · St Michel'
                            city:
                              type: string
                              example: Cotonou
                            country:
                              type: string
                              example: BJ
                            stop_order:
                              type: integer
                              example: 1
                            km_from_origin:
                              type: integer
                              example: 0
        404:
          description: 'Line not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Modules\BusNetwork\Models\Line].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Modules\BusNetwork\Models\Line].'
      tags:
        - Bus
      security: []
    parameters:
      -
        in: path
        name: uuid
        description: ''
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
      -
        in: path
        name: line
        description: 'Public UUID of the line.'
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
  '/api/v1/bus/departures/{departure_uuid}/seats':
    get:
      summary: 'List departure seats.'
      operationId: listDepartureSeats
      description: "Returns every seat on the assigned bus, with its availability status for\nthe requested origin/destination segment (available, held, occupied, or blocked).\nAdds `composition_uuid` and `grid` (canonical cabin layout; cells join\n`data` seats on `code`). Both are null when the bus has no template."
      parameters:
        -
          in: query
          name: origin_stop_uuid
          description: 'Public UUID of the boarding stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'Public UUID of the boarding stop.'
            example: 00000000-0000-4000-8000-000000000000
        -
          in: query
          name: destination_stop_uuid
          description: 'Public UUID of the drop-off stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'Public UUID of the drop-off stop.'
            example: 00000000-0000-4000-8000-000000000000
      responses:
        200:
          description: 'Seat map'
          content:
            application/json:
              schema:
                type: object
                example:
                  composition_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                  grid:
                    rows: 2
                    cols: 4
                    cells:
                      -
                        kind: driver
                        x: 0
                        'y': 0
                      -
                        kind: door
                        x: 3
                        'y': 0
                      -
                        kind: seat
                        x: 0
                        'y': 1
                        code: 1A
                        seatKind: standard
                      -
                        kind: aisle
                        x: 2
                        'y': 1
                      -
                        kind: seat
                        x: 3
                        'y': 1
                        code: 1B
                        seatKind: standard
                        maintenance: true
                  data:
                    -
                      uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e50
                      code: 1A
                      type: standard
                      sellable: true
                      availability_status: available
                      held_until: null
                    -
                      uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e51
                      code: 1B
                      type: standard
                      sellable: true
                      availability_status: held
                      held_until: '2026-08-15T07:20:00.000000Z'
                    -
                      uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e52
                      code: 1C
                      type: standard
                      sellable: true
                      availability_status: occupied
                      held_until: null
                properties:
                  composition_uuid:
                    type: string
                    example: 00000000-0000-4000-8000-000000000000
                  grid:
                    type: object
                    properties:
                      rows:
                        type: integer
                        example: 2
                      cols:
                        type: integer
                        example: 4
                      cells:
                        type: array
                        example:
                          -
                            kind: driver
                            x: 0
                            'y': 0
                          -
                            kind: door
                            x: 3
                            'y': 0
                          -
                            kind: seat
                            x: 0
                            'y': 1
                            code: 1A
                            seatKind: standard
                          -
                            kind: aisle
                            x: 2
                            'y': 1
                          -
                            kind: seat
                            x: 3
                            'y': 1
                            code: 1B
                            seatKind: standard
                            maintenance: true
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                              example: driver
                            x:
                              type: integer
                              example: 0
                            'y':
                              type: integer
                              example: 0
                  data:
                    type: array
                    example:
                      -
                        uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e50
                        code: 1A
                        type: standard
                        sellable: true
                        availability_status: available
                        held_until: null
                      -
                        uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e51
                        code: 1B
                        type: standard
                        sellable: true
                        availability_status: held
                        held_until: '2026-08-15T07:20:00.000000Z'
                      -
                        uuid: 6e2e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e52
                        code: 1C
                        type: standard
                        sellable: true
                        availability_status: occupied
                        held_until: null
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: 00000000-0000-4000-8000-000000000000
                        code:
                          type: string
                          example: 1A
                        type:
                          type: string
                          example: standard
                        sellable:
                          type: boolean
                          example: false
                        availability_status:
                          type: string
                          example: available
                        held_until:
                          type: string
                          example: null
                          nullable: true
        422:
          description: 'Invalid segment'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The requested origin and destination do not form a valid ordered segment for this line.'
                  errors:
                    segment:
                      - 'The requested origin and destination do not form a valid ordered segment for this line.'
                properties:
                  message:
                    type: string
                    example: 'The requested origin and destination do not form a valid ordered segment for this line.'
                  errors:
                    type: object
                    properties:
                      segment:
                        type: array
                        example:
                          - 'The requested origin and destination do not form a valid ordered segment for this line.'
                        items:
                          type: string
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin_stop_uuid:
                  type: string
                  description: 'Le champ value doit être un UUID valide.'
                  example: 00000000-0000-4000-8000-000000000000
                destination_stop_uuid:
                  type: string
                  description: 'Le champ value doit être un UUID valide.'
                  example: 00000000-0000-4000-8000-000000000000
              required:
                - origin_stop_uuid
                - destination_stop_uuid
      security: []
    parameters:
      -
        in: path
        name: departure_uuid
        description: ''
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
      -
        in: path
        name: departure
        description: 'Public UUID of the departure.'
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
  /api/v1/bus/itineraries:
    get:
      summary: 'Search for multi-line itineraries (direct and with connections).'
      operationId: searchForMultiLineItinerariesdirectAndWithConnections
      description: "Returns rich leg data (line, bus with amenities, origin/destination stops\nwith city and country, available seats count, service class) so the\nmobile client can render search results without extra calls."
      parameters:
        -
          in: query
          name: from_physical_stop_uuid
          description: 'UUID of the origin physical stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'UUID of the origin physical stop.'
