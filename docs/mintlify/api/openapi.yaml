openapi: 3.0.3
info:
  title: 'Kora Platforme Web API Documentation'
  description: 'KORA BUS MVP REST API.'
  version: 1.0.0
servers:
  - url: 'http://kora-ops-web.local'
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
tags:
  - name: Bus
    description: "\nPublic Bus catalog endpoints for KORA BUS search experiences."
  - name: Auth
    description: "\nOTP challenge request and verification for registration, login, PIN reset and account unlock."
  - name: Health
    description: "\nApplication health and liveness probes for load balancers and monitoring."
  - name: Payments
    description: "\nPayment lifecycle endpoints: initiation, polling status, and provider webhook confirmation."
paths:
  /api/v1/bus/cities:
    get:
      summary: 'List served cities.'
      operationId: listServedCities
      description: 'Returns active cities derived from active Bus stops.'
      parameters: []
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Bus
      security: []
  /api/v1/bus/lines:
    get:
      summary: 'List Bus lines.'
      operationId: listBusLines
      description: ''
      parameters:
        -
          in: query
          name: from
          description: 'Optional origin city filter.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city filter.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter.'
            example: Abidjan
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Bus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: validation.max.
                  example: b
                  nullable: true
                to:
                  type: string
                  description: validation.max.
                  example: 'n'
                  nullable: true
      security: []
  '/api/v1/bus/lines/{uuid}':
    get:
      summary: 'Show a Bus line.'
      operationId: showABusLine
      description: ''
      parameters: []
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Bus
      security: []
    parameters:
      -
        in: path
        name: uuid
        description: ''
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
  /api/v1/bus/departures:
    get:
      summary: 'List departures.'
      operationId: listDepartures
      description: ''
      parameters:
        -
          in: query
          name: date
          description: 'Travel date in YYYY-MM-DD format.'
          example: '2026-08-15'
          required: true
          schema:
            type: string
            description: 'Travel date in YYYY-MM-DD format.'
            example: '2026-08-15'
        -
          in: query
          name: from
          description: 'Optional origin city filter.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city filter.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city filter.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city filter.'
            example: Abidjan
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-08-25'
                from:
                  type: string
                  description: validation.max.
                  example: b
                  nullable: true
                to:
                  type: string
                  description: validation.max.
                  example: 'n'
                  nullable: true
              required:
                - date
      security: []
  '/api/v1/bus/departures/{uuid}':
    get:
      summary: 'Show a departure.'
      operationId: showADeparture
      description: ''
      parameters:
        -
          in: query
          name: from
          description: 'Optional origin city.'
          example: Cotonou
          required: false
          schema:
            type: string
            description: 'Optional origin city.'
            example: Cotonou
        -
          in: query
          name: to
          description: 'Optional destination city.'
          example: Abidjan
          required: false
          schema:
            type: string
            description: 'Optional destination city.'
            example: Abidjan
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Bus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: validation.max.
                  example: b
                  nullable: true
                to:
                  type: string
                  description: validation.max.
                  example: 'n'
                  nullable: true
      security: []
    parameters:
      -
        in: path
        name: uuid
        description: ''
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
  '/api/v1/bus/departures/{departure_uuid}/seats':
    get:
      summary: 'List departure seats.'
      operationId: listDepartureSeats
      description: ''
      parameters:
        -
          in: query
          name: origin_stop_uuid
          description: 'Public UUID of the boarding stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'Public UUID of the boarding stop.'
            example: 00000000-0000-4000-8000-000000000000
        -
          in: query
          name: destination_stop_uuid
          description: 'Public UUID of the drop-off stop.'
          example: 00000000-0000-4000-8000-000000000000
          required: true
          schema:
            type: string
            description: 'Public UUID of the drop-off stop.'
            example: 00000000-0000-4000-8000-000000000000
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin_stop_uuid:
                  type: string
                  description: validation.uuid.
                  example: 00000000-0000-4000-8000-000000000000
                destination_stop_uuid:
                  type: string
                  description: validation.uuid.
                  example: 00000000-0000-4000-8000-000000000000
              required:
                - origin_stop_uuid
                - destination_stop_uuid
      security: []
    parameters:
      -
        in: path
        name: departure_uuid
        description: ''
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
  /api/v1/bus/quotes:
    post:
      summary: 'Create a fixed price quote.'
      operationId: createAFixedPriceQuote
      description: 'The quote expiration uses the backend-configured `KORA_QUOTE_TTL_MINUTES` duration.'
      parameters: []
      responses:
        201:
          description: 'Quote created'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    departure_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                    origin_stop_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6f
                    destination_stop_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb70
                    service_class_uuid: null
                    base_amount: 12500
                    coefficient: 1.0
                    final_amount: 12500
                    currency: XOF
                    passenger_count: 1
                    total_amount: 12500
                    expires_at: '2026-08-20T08:10:00Z'
                    snapshot:
                      fare_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6f
                      line_code: L2
                      origin_stop: 'Cotonou · St Michel'
                      destination_stop: Malanville
                      service_class: Standard
                      passenger_count: 1
                      total_amount: 12500
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      departure_uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      origin_stop_uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      destination_stop_uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      service_class_uuid:
                        type: string
                        example: null
                        nullable: true
                      base_amount:
                        type: integer
                        example: 12500
                      coefficient:
                        type: number
                        example: 1.0
                      final_amount:
                        type: integer
                        example: 12500
                      currency:
                        type: string
                        example: XOF
                      passenger_count:
                        type: integer
                        example: 1
                      total_amount:
                        type: integer
                        example: 12500
                      expires_at:
                        type: string
                        example: '2026-08-20T08:10:00Z'
                      snapshot:
                        type: object
                        properties:
                          fare_uuid:
                            type: string
                            example: 00000000-0000-4000-8000-000000000000
                          line_code:
                            type: string
                            example: L2
                          origin_stop:
                            type: string
                            example: 'Cotonou · St Michel'
                          destination_stop:
                            type: string
                            example: Malanville
                          service_class:
                            type: string
                            example: Standard
                          passenger_count:
                            type: integer
                            example: 1
                          total_amount:
                            type: integer
                            example: 12500
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        422:
          description: 'Invalid quote request'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    destination_stop_uuid:
                      - "L'arrêt de destination doit être situé après l'arrêt d'origine."
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      destination_stop_uuid:
                        type: array
                        example:
                          - "L'arrêt de destination doit être situé après l'arrêt d'origine."
                        items:
                          type: string
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                departure_uuid:
                  type: string
                  description: 'validation.uuid Must match an existing stored value.'
                  example: 00000000-0000-4000-8000-000000000000
                origin_stop_uuid:
                  type: string
                  description: 'validation.uuid Must match an existing stored value.'
                  example: 00000000-0000-4000-8000-000000000000
                destination_stop_uuid:
                  type: string
                  description: 'validation.uuid Must match an existing stored value.'
                  example: 00000000-0000-4000-8000-000000000000
                service_class_uuid:
                  type: string
                  description: 'validation.uuid Must match an existing stored value.'
                  example: 00000000-0000-4000-8000-000000000000
                  nullable: true
                passenger_count:
                  type: integer
                  description: 'validation.min validation.max.'
                  example: 6
                  nullable: true
              required:
                - departure_uuid
                - origin_stop_uuid
                - destination_stop_uuid
      security:
        - sanctum: []
  /api/v1/bus/holds:
    post:
      summary: 'Hold seats for the configured server-side duration.'
      operationId: holdSeatsForTheConfiguredServerSideDuration
      description: 'The hold starts only when this endpoint is called, after the passenger confirms the selected seats.'
      parameters: []
      responses:
        201:
          description: 'Seats held'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb70
                    status: held
                    expires_at: '2026-08-20T08:15:00Z'
                    total_amount: 12500
                    currency: XOF
                    channel: mobile
                    departure_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                    price_quote_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6f
                    segments:
                      -
                        uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb71
                        seat_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb72
                        seat_code: 4A
                        origin_stop: 'Cotonou · St Michel'
                        destination_stop: Malanville
                        status: held
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      status:
                        type: string
                        example: held
                      expires_at:
                        type: string
                        example: '2026-08-20T08:15:00Z'
                      total_amount:
                        type: integer
                        example: 12500
                      currency:
                        type: string
                        example: XOF
                      channel:
                        type: string
                        example: mobile
                      departure_uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      price_quote_uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      segments:
                        type: array
                        example:
                          - uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb71
                            seat_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb72
                            seat_code: 4A
                            origin_stop: 'Cotonou · St Michel'
                            destination_stop: Malanville
                            status: held
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              example: 00000000-0000-4000-8000-000000000000
                            seat_uuid:
                              type: string
                              example: 00000000-0000-4000-8000-000000000000
                            seat_code:
                              type: string
                              example: 4A
                            origin_stop:
                              type: string
                              example: 'Cotonou · St Michel'
                            destination_stop:
                              type: string
                              example: Malanville
                            status:
                              type: string
                              example: held
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        409:
          description: 'Seat unavailable'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Le siège 4A n'est plus disponible sur ce segment."
                  conflicting_seat_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb72
                  seat_code: 4A
                properties:
                  message:
                    type: string
                    example: "Le siège 4A n'est plus disponible sur ce segment."
                  conflicting_seat_uuid:
                    type: string
                    example: 00000000-0000-4000-8000-000000000000
                  seat_code:
                    type: string
                    example: 4A
        422:
          description: 'Invalid hold request'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    seats:
                      - 'Le nombre de sièges doit correspondre au nombre de passagers du devis.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      seats:
                        type: array
                        example:
                          - 'Le nombre de sièges doit correspondre au nombre de passagers du devis.'
                        items:
                          type: string
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                departure_uuid:
                  type: string
                  description: 'validation.uuid Must match an existing stored value.'
                  example: 00000000-0000-4000-8000-000000000000
                origin_stop_uuid:
                  type: string
                  description: 'validation.uuid Must match an existing stored value.'
                  example: 00000000-0000-4000-8000-000000000000
                destination_stop_uuid:
                  type: string
                  description: 'validation.uuid Must match an existing stored value.'
                  example: 00000000-0000-4000-8000-000000000000
                price_quote_uuid:
                  type: string
                  description: 'validation.uuid Must match an existing stored value.'
                  example: 00000000-0000-4000-8000-000000000000
                seats:
                  type: array
                  description: validation.min.
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      seat_uuid:
                        type: string
                        description: 'validation.uuid Must match an existing stored value.'
                        example: 00000000-0000-4000-8000-000000000000
                      passenger_index:
                        type: integer
                        description: ''
                        example: 16
                        nullable: true
                    required:
                      - seat_uuid
              required:
                - departure_uuid
                - origin_stop_uuid
                - destination_stop_uuid
                - price_quote_uuid
                - seats
      security:
        - sanctum: []
  '/api/v1/bookings/{reservation_uuid}/passengers':
    post:
      summary: 'Store passenger details for a reservation.'
      operationId: storePassengerDetailsForAReservation
      description: ''
      parameters: []
      responses:
        200:
          description: 'Passengers stored'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb70
                    status: held
                    expires_at: '2026-08-20T08:15:00Z'
                    total_amount: 12500
                    currency: XOF
                    channel: mobile
                    departure_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                    passengers:
                      -
                        uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb73
                        first_name: Aïcha
                        last_name: HOUNKPÈ
                        phone: '+2290197421860'
                        document_type: passport
                        document_number: BJ0427851
                        nationality: BJ
                        birth_date: '1994-04-18'
                        seat_code: 4A
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      status:
                        type: string
                        example: held
                      expires_at:
                        type: string
                        example: '2026-08-20T08:15:00Z'
                      total_amount:
                        type: integer
                        example: 12500
                      currency:
                        type: string
                        example: XOF
                      channel:
                        type: string
                        example: mobile
                      departure_uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      passengers:
                        type: array
                        example:
                          - uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb73
                            first_name: Aïcha
                            last_name: HOUNKPÈ
                            phone: '+2290197421860'
                            document_type: passport
                            document_number: BJ0427851
                            nationality: BJ
                            birth_date: '1994-04-18'
                            seat_code: 4A
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              example: 00000000-0000-4000-8000-000000000000
                            first_name:
                              type: string
                              example: Aïcha
                            last_name:
                              type: string
                              example: HOUNKPÈ
                            phone:
                              type: string
                              example: '+2290197421860'
                            document_type:
                              type: string
                              example: passport
                            document_number:
                              type: string
                              example: BJ0427851
                            nationality:
                              type: string
                              example: BJ
                            birth_date:
                              type: string
                              example: '1994-04-18'
                            seat_code:
                              type: string
                              example: 4A
      tags:
        - Bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passengers:
                  type: array
                  description: validation.min.
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      first_name:
                        type: string
                        description: validation.max.
                        example: b
                      last_name:
                        type: string
                        description: validation.max.
                        example: 'n'
                      phone:
                        type: string
                        description: validation.max.
                        example: g
                        nullable: true
                      email:
                        type: string
                        description: 'validation.email validation.max.'
                        example: rowan.gulgowski@example.com
                        nullable: true
                      document_type:
                        type: string
                        description: ''
                        example: national_id
                        enum:
                          - national_id
                          - passport
                          - consular_card
                          - birth_certificate
                        nullable: true
                      document_number:
                        type: string
                        description: validation.max.
                        example: d
                        nullable: true
                      nationality:
                        type: string
                        description: validation.size.
                        example: lj
                        nullable: true
                      birth_date:
                        type: string
                        description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                        example: '2026-08-25'
                        nullable: true
                      seat_uuid:
                        type: string
                        description: validation.uuid.
                        example: 00000000-0000-4000-8000-000000000000
                        nullable: true
                    required:
                      - first_name
                      - last_name
              required:
                - passengers
      security: []
    parameters:
      -
        in: path
        name: reservation_uuid
        description: ''
        example: 00000000-0000-4000-8000-000000000000
        required: true
        schema:
          type: string
  /api/v1/auth/otp/request:
    post:
      summary: ''
      operationId: postApiV1AuthOtpRequest
      description: ''
      parameters: []
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: gbailey@example.net
                purpose:
                  type: string
                  description: ''
                  example: registration
                  enum:
                    - registration
                    - login_new_device
                    - pin_reset
                    - account_unlock
              required:
                - email
                - purpose
      security: []
  /api/v1/auth/otp/verify:
    post:
      summary: ''
      operationId: postApiV1AuthOtpVerify
      description: ''
      parameters: []
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_challenge_uuid:
                  type: string
                  description: validation.uuid.
                  example: 00000000-0000-4000-8000-000000000000
                purpose:
                  type: string
                  description: ''
                  example: registration
                  enum:
                    - registration
                    - login_new_device
                    - pin_reset
                    - account_unlock
                code:
                  type: string
                  description: validation.digits.
                  example: '569775'
              required:
                - otp_challenge_uuid
                - purpose
                - code
      security: []
  /api/v1/auth/pin/reset:
    post:
      summary: ''
      operationId: postApiV1AuthPinReset
      description: ''
      parameters: []
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_challenge_uuid:
                  type: string
                  description: validation.uuid.
                  example: 00000000-0000-4000-8000-000000000000
                verification_token:
                  type: string
                  description: validation.size.
                  example: gzmiyvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbewtn
                pin:
                  type: string
                  description: validation.digits.
                  example: '9775'
              required:
                - otp_challenge_uuid
                - verification_token
                - pin
      security: []
  /api/v1/auth/unlock:
    post:
      summary: ''
      operationId: postApiV1AuthUnlock
      description: ''
      parameters: []
      responses:
        default:
          description: Response documented by the endpoint annotations.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_challenge_uuid:
                  type: string
                  description: validation.uuid.
                  example: 00000000-0000-4000-8000-000000000000
                verification_token:
