                  data:
                    type: object
                    properties:
                      ticketUuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      name:
                        type: string
                        example: 'Awa Traoré'
                      firstName:
                        type: string
                        example: Awa
                      lastName:
                        type: string
                        example: Traoré
                      phone:
                        type: string
                        example: '+22990000000'
                      email:
                        type: string
                        example: null
