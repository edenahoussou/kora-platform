        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: "Email or phone number. Local and international\nnumbers are normalized before lookup. Do not send together with `email`."
                  example: architecto
                  nullable: true
                email:
                  type: string
                  description: 'Legacy alias for `identifier`, accepted for existing clients.'
                  example: gbailey@example.net
                  nullable: true
                pin:
                  type: string
                  description: 'Four-digit PIN.'
                  example: architecto
                device_name:
                  type: string
                  description: 'Nom de l’appareil à enregistrer. Le champ value ne doit pas dépasser 120 caractères.'
                  example: 'n'
                platform:
                  type: string
                  description: 'Plateforme de l’appareil ou du client.'
                  example: android
                  enum:
                    - android
                    - ios
                    - web
                    - unknown
                device_fingerprint:
                  type: string
                  description: 'Valeur de « device fingerprint ». Le champ value doit contenir au moins 16 caractères. Le champ value ne doit pas dépasser 255 caractères.'
                  example: g
                push_token:
                  type: string
                  description: 'Jeton de notification push de l’appareil. Le champ value ne doit pas dépasser 512 caractères.'
                  example: z
                  nullable: true
                otp_challenge_uuid:
                  type: string
                  description: 'UUID du challenge OTP. This field is required when <code>verification_token</code> is present. Le champ value doit être un UUID valide.'
                  example: 00000000-0000-4000-8000-000000000000
                  nullable: true
                verification_token:
                  type: string
                  description: 'Jeton de vérification à usage unique. This field is required when <code>otp_challenge_uuid</code> is present. Le champ value doit contenir 64 caractères.'
                  example: yvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtujwvlxjklqppwqbewtnnoqi
                  nullable: true
              required:
                - identifier
                - pin
                - device_name
                - platform
                - device_fingerprint
      security: []
