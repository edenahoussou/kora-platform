          description: 'Passager corrigé'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    ticketUuid: 3a1e4b2a-8f1a-4b3e-9a1a-2f4b6c8d0e41
                    name: 'Awa Traoré'
                    firstName: Awa
                    lastName: Traoré
