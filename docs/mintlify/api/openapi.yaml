  /api/v1/auth/otp/request:
    post:
      summary: 'Request an OTP challenge for registration, login, PIN reset or account unlock.'
      operationId: requestAnOTPChallengeForRegistrationLoginPINResetOrAccountUnlock
      description: "Sends a one-time code via SMS when configured, falling back to WhatsApp, with email\nfallback. The returned `otp_challenge_uuid` must be submitted to the verify endpoint."
      parameters: []
      responses:
        '202':
          description: 'OTP sent'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    otp_challenge_uuid: b1234567-89ab-cdef-0123-456789abcdef
                    purpose: registration
                    email: aicha.hounkpe@gmail.com
                    expires_at: '2026-08-20T13:10:00.000Z'
                properties:
                  data:
                    type: object
                    properties:
                      otp_challenge_uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      purpose:
                        type: string
                        example: registration
                      email:
                        type: string
                        example: aicha.hounkpe@gmail.com
                      expires_at:
                        type: string
                        example: '2026-01-01T00:00:00+00:00'
        '404':
          description: 'User not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: user_not_found
                    message: 'Utilisateur introuvable.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: user_not_found
                      message:
                        type: string
                        example: 'Utilisateur introuvable.'
        '422':
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    identifier:
                      - "L'email ou le numéro de téléphone est obligatoire."
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      identifier:
                        type: array
                        example:
                          - "L'email ou le numéro de téléphone est obligatoire."
                        items:
                          type: string
        '429':
          description: 'Too many requests'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too many requests. Please try again later.'
                properties:
                  message:
                    type: string
                    example: 'Too many requests. Please try again later.'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: "Email or phone number. For registration, this\nmust be an email. Existing clients may use the `email` alias instead."
                  example: architecto
                  nullable: true
                email:
                  type: string
                  description: 'Legacy alias for `identifier`; do not send both fields.'
                  example: agent@kora.example
                  nullable: true
                purpose:
                  type: string
                  description: 'Motif de la demande OTP.'
                  example: registration
                  enum:
                    - registration
                    - login_new_device
                    - pin_reset
                    - account_unlock
              required:
                - identifier
                - purpose
      security: []
