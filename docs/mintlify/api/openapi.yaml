  '/api/v1/bookings/{reservation_uuid}/promo-code':
    put:
      summary: 'Apply or remove a promo code on a held reservation.'
      operationId: applyOrRemoveAPromoCodeOnAHeldReservation
      description: "Lets the passenger enter (or clear) a promo code on the payment screen,\nafter the quote and hold are already created. The reservation total is\nrecalculated in place — seats and passengers are untouched. Only allowed\nwhile the reservation is still held and no payment is in progress. The\npromotion usage is recorded only once the payment is confirmed."
