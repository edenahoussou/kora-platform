                          -
                            segment_uuid: 2c4e6a8b-0d2f-4a6c-8e0b-2d4f6a8c0e2b
                            passenger_index: 0
                            leg_order: 1
                            seat_uuid: 8d3f6a2c-1e4b-4c5d-9a2f-4b6d8e0f2a4c
