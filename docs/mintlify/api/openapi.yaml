      responses:
        '200':
          description: 'Resumed online'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    uuid: 5b0d2f4a-6c8e-4a1b-9d3f-1a3c5e7b9d2f
                    reference: KBR-7X2K9P4Q
                    status: held
                    channel: mobile
                    amount: 8500
                    currency: XOF
                    expires_at: '2026-09-20T11:45:00+00:00'
                    seats:
                      -
                        segment_uuid: 2c4e6a8b-0d2f-4a6c-8e0b-2d4f6a8c0e2b
                        passenger_index: 0
                        leg_order: 1
                        seat_uuid: 8d3f6a2c-1e4b-4c5d-9a2f-4b6d8e0f2a4c
                        seat_code: 2A
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 00000000-0000-4000-8000-000000000000
                      reference:
                        type: string
                        example: KBR-7X2K9P4Q
                      status:
                        type: string
                        example: held
                      channel:
                        type: string
                        example: mobile
                      amount:
                        type: integer
                        example: 8500
                      currency:
                        type: string
                        example: XOF
                      expires_at:
                        type: string
                        example: '2026-01-01T00:00:00+00:00'
                      seats:
                        type: array
                        example:
                          -
                            segment_uuid: 2c4e6a8b-0d2f-4a6c-8e0b-2d4f6a8c0e2b
                            passenger_index: 0
                            leg_order: 1
                            seat_uuid: 8d3f6a2c-1e4b-4c5d-9a2f-4b6d8e0f2a4c
                            seat_code: 2A
                        items:
                          type: object
                          properties:
                            segment_uuid:
                              type: string
                              example: 00000000-0000-4000-8000-000000000000
                            passenger_index:
                              type: integer
                              example: 0
                            leg_order:
                              type: integer
                              example: 1
                            seat_uuid:
                              type: string
                              example: 00000000-0000-4000-8000-000000000000
                            seat_code:
                              type: string
                              example: 2A
        '403':
          description: 'Not the reservation owner'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        '409':
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Already claimed by an agency'
                    type: object
                    example:
                      message: 'Le dossier est déjà pris en charge par une agence.'
                    properties:
                      message:
                        type: string
                        example: 'Le dossier est déjà pris en charge par une agence.'
                  -
                    description: 'Seat no longer available'
                    type: object
                    example:
                      message: "Le siège 2A n'est plus disponible sur ce segment."
                      conflicting_seat_uuid: 8d3f6a2c-1e4b-4c5d-9a2f-4b6d8e0f2a4c
                      seat_code: 2A
                    properties:
                      message:
                        type: string
