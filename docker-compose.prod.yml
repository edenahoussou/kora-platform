# Production environment - deploiement manuel sur tag v*
services:
  app:
    image: ghcr.io/edenahoussou/kora-ops-web:latest
    build:
      context: .
      dockerfile: infra/docker/kora-ops-web/Dockerfile.prod
    container_name: kora-prod-app
    working_dir: /app
    env_file: .env.prod
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kora_prod
      DB_USERNAME: kora
      DB_PASSWORD: ${DB_PASSWORD_PROD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_STACK: docker
    volumes:
      - prod-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kora-prod
    restart: unless-stopped

  nginx:
    build:
      context: infra/docker/nginx/
      dockerfile: Dockerfile
    container_name: kora-prod-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - prod-public:/app/public:ro
    depends_on:
      - app
    networks:
      - kora-prod
    restart: unless-stopped

  # Copie les assets de l'image app vers le volume prod-public
  sync-public:
    image: ghcr.io/edenahoussou/kora-ops-web:latest
    container_name: kora-prod-sync-public
    volumes:
      - prod-public:/sync
    command: [ "sh", "-c", "cp -a /app/public/. /sync/ && echo 'Public assets synced'" ]
    depends_on:
      - app
    networks:
      - kora-prod
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: kora-prod-postgres
    environment:
      POSTGRES_DB: kora_prod
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: ${DB_PASSWORD_PROD}
    volumes:
      - prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kora -d kora_prod" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kora-prod
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kora-prod-redis
    volumes:
      - prod-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kora-prod
    restart: unless-stopped

volumes:
  prod-storage:
  prod-public:
  prod-postgres-data:
  prod-redis-data:

networks:
  kora-prod:
    driver: bridge
