name: Flutter Design System

on:
  push:
    branches:
      - main
    paths:
      - 'packages/flutter-design-system/**'
      - '.github/workflows/flutter-design-system.yml'
  pull_request:
    paths:
      - 'packages/flutter-design-system/**'
      - '.github/workflows/flutter-design-system.yml'
  # Outil manuel : régénère les goldens directement sur l'environnement CI
  # (ubuntu-latest) plutôt que sur une machine de dev locale — évite les
  # écarts de rendu entre OS/version Flutter qui font échouer les golden
  # tests sur des changements pourtant corrects. À lancer depuis l'onglet
  # Actions ("Run workflow") après un changement visuel, puis télécharger
  # l'artefact `regenerated-goldens` et l'extraire dans test/golden/.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter-design-system

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test (widgets + golden)
        run: flutter test

  widgetbook-preview:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: packages/flutter-design-system

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Rend Widgetbook accessible pour validation sans dépendre du VPS de
      # staging : le catalogue statique (web) est publié comme artefact
      # téléchargeable de la run — à ouvrir en local via `build/web/index.html`
      # servi par n'importe quel serveur statique (ex: `npx serve`).
      - name: Build Widgetbook (web)
        run: flutter build web -t widgetbook/main.dart --release

      - name: Upload Widgetbook preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: widgetbook-preview
          path: packages/flutter-design-system/build/web
          retention-days: 30

  # Ne tourne que sur déclenchement manuel (voir le commentaire sur
  # `workflow_dispatch` en haut du fichier) — jamais sur push/PR.
  update-goldens:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter-design-system

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate goldens
        run: flutter test --update-goldens

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: packages/flutter-design-system/test/golden/*.png
          retention-days: 7
