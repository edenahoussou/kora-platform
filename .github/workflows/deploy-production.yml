name: Deploy Production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/kora-ops-web/Dockerfile.prod
          push: true
          build-args: |
            VITE_APP_ENV=production
            VITE_SENTRY_DSN=${{ vars.SENTRY_DSN_PUBLIC }}
            SENTRY_RELEASE=${{ steps.tag.outputs.VERSION }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kora-ops-web:latest
            ghcr.io/${{ github.repository_owner }}/kora-ops-web:${{ steps.tag.outputs.VERSION }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/kora-prod
            git checkout -- .
            git clean -fd
            git pull origin main

            # Backup DB avant migration
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            mkdir -p /opt/kora-prod/backups
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T postgres pg_dump -U kora kora_prod > /opt/kora-prod/backups/db-backup-$TIMESTAMP.sql
            echo "Backup created: db-backup-$TIMESTAMP.sql"

            # Garder seulement les 5 derniers backups
            ls -t /opt/kora-prod/backups/db-backup-*.sql | tail -n +6 | xargs rm -f 2>/dev/null || true

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull app
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm sync-public
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan migrate --force
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan db:seed --class=KoraBusRolePermissionSeeder --force
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan config:cache
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan route:cache
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan view:cache
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan event:cache
            docker compose -f docker-compose.prod.yml --env-file .env.prod restart nginx
            docker image prune -f
            echo "Production deployed: $(date)"
