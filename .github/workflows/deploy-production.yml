name: Deploy Production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      tag: ${{ steps.revision.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve production revision
        id: revision
        run: |
          tag=${GITHUB_REF#refs/tags/}
          [[ "$tag" =~ ^v[0-9][A-Za-z0-9_.-]*$ && ${#tag} -le 128 ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/kora-ops-web/Dockerfile.prod
          push: true
          cache-from: type=gha,scope=kora-ops-web
          cache-to: type=gha,mode=max,scope=kora-ops-web
          build-args: |
            VITE_APP_ENV=production
            VITE_APP_VERSION=${{ steps.revision.outputs.tag }}
            VITE_SENTRY_DSN=${{ vars.SENTRY_DSN_PUBLIC }}
            SENTRY_RELEASE=${{ steps.revision.outputs.tag }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kora-ops-web:${{ steps.revision.outputs.tag }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/nginx
          file: infra/docker/nginx/Dockerfile
          push: true
          cache-from: type=gha,scope=kora-ops-web-nginx
          cache-to: type=gha,mode=max,scope=kora-ops-web-nginx
          tags: |
            ghcr.io/${{ github.repository_owner }}/kora-ops-web-nginx:${{ steps.revision.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS production
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ needs.build-and-push.outputs.sha }}
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_SHA,DEPLOY_TAG
          script: |
            set -e
            cd /opt/kora-prod
            git fetch --no-tags origin "refs/tags/$DEPLOY_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            export KORA_IMAGE_TAG="$DEPLOY_TAG" KORA_NGINX_IMAGE_TAG="$DEPLOY_TAG"
            images=$(docker compose -f docker-compose.prod.yml --env-file .env.prod config --images)
            printf '%s\n' "$images" | grep -Fx "ghcr.io/${{ github.repository_owner }}/kora-ops-web:$DEPLOY_TAG"
            printf '%s\n' "$images" | grep -Fx "ghcr.io/${{ github.repository_owner }}/kora-ops-web-nginx:$DEPLOY_TAG"

            # Backup DB avant migration
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            mkdir -p /opt/kora-prod/backups
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T postgres pg_dump -U kora kora_prod > /opt/kora-prod/backups/db-backup-$TIMESTAMP.sql
            echo "Backup created: db-backup-$TIMESTAMP.sql"

            # Garder seulement les 5 derniers backups
            ls -t /opt/kora-prod/backups/db-backup-*.sql | tail -n +6 | xargs rm -f 2>/dev/null || true

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm sync-public
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan migrate --force
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan db:seed --class=KoraBusRolePermissionSeeder --force
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan db:seed --class=WalletLoyaltyRuleVersionSeeder --force
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan config:cache
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan route:cache
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan view:cache
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T -u www-data app php artisan event:cache
            docker compose -f docker-compose.prod.yml --env-file .env.prod restart nginx
            docker image prune -f
            echo "Production deployed: $(date)"
      - name: Check deployment health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 https://prod.koraexpress.app/api/v1/health

      - name: Record deployed revision
        env:
          DEPLOY_SHA: ${{ needs.build-and-push.outputs.sha }}
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: printf 'Déployé **%s** depuis `%s`\n' "$DEPLOY_TAG" "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
