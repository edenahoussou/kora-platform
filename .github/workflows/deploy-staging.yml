name: Deploy Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/kora-ops-web/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kora-ops-web:staging
            ghcr.io/${{ github.repository_owner }}/kora-ops-web:staging-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/kora-staging
            git pull origin main
            docker compose -f docker-compose.staging.yml pull app
            docker compose -f docker-compose.staging.yml up -d --no-deps app nginx
            docker compose -f docker-compose.staging.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.staging.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.staging.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.staging.yml exec -T app php artisan view:cache
            docker compose -f docker-compose.staging.yml exec -T app php artisan event:cache
            docker image prune -f
            echo "Staging deployed: $(date)"
