name: Release Mobile

on:
  push:
    tags:
      - 'v*'
  # Produire un APK de test interne sans poser de tag : on choisit
  # l'environnement depuis l'onglet Actions. Un tag, lui, vise toujours
  # la prod (voir TARGET_ENV plus bas).
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement visé par l'APK"
        type: choice
        default: staging
        options:
          - staging
          - prod

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Build APK release signé pour kora-app-passenger
  # ------------------------------------------------------------------
  passenger-apk:
    name: kora-app-passenger APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kora-app-passenger
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      # `flutter build` sans `-t` prend lib/main.dart, qui redirige vers
      # main_dev.dart : un APK tagué v1.0.0 taperait sur staging. On
      # nomme donc toujours le point d'entrée explicitement.
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > android/key.properties

      - name: Build APK (release)
        run: flutter build apk --release -t lib/main_${TARGET_ENV}.dart

      - name: Rename APK with version tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Un lancement manuel n'a pas de tag : on retombe sur le SHA
          # court, pour que le nom du fichier dise toujours d'où il vient.
          if [ "$GITHUB_REF" = "$TAG" ]; then
            TAG="${TARGET_ENV}-${GITHUB_SHA::7}"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kora-app-passenger-${TAG}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kora-app-passenger-apk
          path: apps/kora-app-passenger/build/app/outputs/flutter-apk/kora-app-passenger-*.apk
          retention-days: 90

      - name: Create GitHub Release
        # Seul un tag donne lieu à une release publiée ; un build manuel
        # s'arrête à l'artefact de l'étape précédente.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/kora-app-passenger/build/app/outputs/flutter-apk/kora-app-passenger-*.apk
          name: KORA App Passenger ${{ github.ref_name }}
