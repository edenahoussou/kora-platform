name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kora-ops-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: bcmath, intl, pdo_pgsql, pdo_sqlite, zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/kora-ops-web/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Browsershot (PDF tests)
        run: |
          # Install puppeteer and download a compatible Chromium binary
          # that Browsershot can use without snap sandbox restrictions.
          npm install puppeteer --no-save
          npx puppeteer browsers install chrome-headless-shell
          # Browsershot looks for node at /usr/bin/node by default;
          # symlink the setup-node binary so the path resolves.
          sudo ln -sf "$(which node)" /usr/bin/node

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          # Point Browsershot at the puppeteer-downloaded chrome-headless-shell.
          CHROME_PATH=$(find ~/.cache/puppeteer -name 'chrome-headless-shell' -type f 2>/dev/null | head -1)
          printf "BROWSERSHOT_CHROME_PATH=%s\n" "$CHROME_PATH" >> .env
          # Browsershot temp dir must exist before writing HTML files.
          mkdir -p storage/app/temp/chrome
          # Ticket QR signing keys (test keypair, safe for CI).
          echo "KORA_TICKET_SIGNING_PRIVATE_KEY=I6KFQT1V89kAkMD6j9tF6V/I6Ij5uH0aomSdMNy/phRMOMFt06hCiB+GO9hsZ0w/KOwnsHsB1AC5OSgh/AOsMQ=" >> .env
          echo "KORA_TICKET_SIGNING_PUBLIC_KEY=TDjBbdOoQogfhjvYbGdMPyjsJ7B7AdQAuTkoIfwDrDE=" >> .env

      - name: Generate Wayfinder routes/actions
        run: php artisan wayfinder:generate --with-form

      - name: Pint (PHP lint check)
        run: composer lint:check

      - name: PHPStan (types check)
        run: composer types:check

      - name: ESLint (frontend lint check)
        run: npm run lint:check

      - name: TypeScript (types check)
        run: npm run types:check

      - name: Prettier (format check)
        run: npm run format:check

      - name: Vite build
        run: npm run build

      - name: Pest (tests)
        run: php artisan test

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if docs-relevant files changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'apps/kora-ops-web/app/Modules/**/Http/Controllers/**'
              - 'apps/kora-ops-web/app/Modules/**/Http/Requests/**'
              - 'apps/kora-ops-web/app/Modules/**/Http/Resources/**'
              - 'apps/kora-ops-web/routes/**'
              - 'apps/kora-ops-web/composer.json'
              - 'apps/kora-ops-web/composer.lock'
              - 'docs/mintlify/**'
              - '.github/workflows/ci.yml'

      - name: Setup PHP
        if: steps.filter.outputs.docs == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: bcmath, intl, pdo_pgsql, pdo_sqlite, zip

      - name: Setup Node
        if: steps.filter.outputs.docs == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/mintlify/package-lock.json

      - name: Install PHP dependencies
        if: steps.filter.outputs.docs == 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        working-directory: apps/kora-ops-web

      - name: Prepare Laravel
        if: steps.filter.outputs.docs == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate
          # Scribe exécute les routes pour générer les exemples de réponse.
          # Le job docs n'a ni PostgreSQL ni Redis : on bascule sur SQLite
          # (fichier) et le cache array, puis on migre pour que les
          # contrôleurs qui requêtent la base (ex. GroupBookingSetting::current())
          # ne plantent pas. On ne peut pas utiliser :memory: car Scribe tourne
          # dans un processus séparé de migrate.
          sed -i 's/DB_CONNECTION=pgsql/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=kora|DB_DATABASE=database/scribe.sqlite|' .env
          sed -i 's/CACHE_STORE=redis/CACHE_STORE=array/' .env
          sed -i 's/SESSION_DRIVER=database/SESSION_DRIVER=file/' .env
          touch database/scribe.sqlite
          php artisan migrate --force
        working-directory: apps/kora-ops-web

      - name: Generate OpenAPI spec (Scribe)
        if: steps.filter.outputs.docs == 'true'
        run: composer docs:generate
        working-directory: apps/kora-ops-web

      - name: Verify OpenAPI spec is up to date
        if: steps.filter.outputs.docs == 'true'
        run: |
          if ! git diff --exit-code -- docs/mintlify/api/openapi.yaml; then
            echo "::error::OpenAPI spec is stale. Run 'composer docs:generate' locally and commit the updated spec."
            git diff -- docs/mintlify/api/openapi.yaml
            exit 1
          fi

      - name: Install Mintlify CLI
        if: steps.filter.outputs.docs == 'true'
        run: npm ci
        working-directory: docs/mintlify

      - name: Mintlify validate (validate docs)
        if: steps.filter.outputs.docs == 'true'
        run: npx mintlify validate
        working-directory: docs/mintlify
